# ARTIFACT GUIDANCE (not project data)
# =============================================================================
# Template output: analysis/migration_status.yaml. Preserve this filename stem.
# See analysis/artifact-naming.md for the naming contract.
# Single process checkpoint, created once during Bootstrap. It is a standing
# input and updated output of every Stage 1-19; stages never create copies.
# When used: the active-stage agent reads it before work to learn the current
# stage, blockers and exact next action.
# How used: the same agent updates it before handoff after a durable transition,
# return, gate result, blocker or owner decision. Do not rewrite it for polling
# or every internal action; a passing command never advances the stage by itself.
# Example: after a clean Stage 7 report, the Stage 7 agent adds the report to
# review_passes and records the transition to Stage 8. The Stage 8 agent reads
# that same checkpoint before starting. Earlier reports become stale after a
# return and re-entry.
# =============================================================================
# PROJECT RECORD (machine-readable values start below)
# =============================================================================
