<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 950" role="img" aria-labelledby="title desc">
<title id="title">Six portable roles: PM delegates specialist work</title>
<desc id="desc">The human owner decides. PM coordinates and delegates to BA, UX, Architect, Developer and QA; PM does not do specialist work. Assignments name scope, revisions and a skill. Specialists explicitly read it and return ACK, then RESULT. Fresh eligible sessions of the same specializations review work. Tools are not agents. Durable records preserve context independently of native client profiles.</desc>
<style>
svg{background:#f7f9fa}text{font-family:Arial,Helvetica,sans-serif;fill:#192b36;letter-spacing:0}.title{font-size:21px;font-weight:700}.body{font-size:17px}.count{font-size:16px;font-weight:700;fill:#49606d}.edge{font-size:16px;paint-order:stroke;stroke:#f7f9fa;stroke-width:7px;stroke-linejoin:round}.note{font-size:16px;fill:#49606d}.node{fill:#fff;stroke:#9aadb8;stroke-width:1.5}.pm{fill:#e5f0fc;stroke:#3975ac;stroke-width:2}.owner{fill:#fff4d9;stroke:#ab812e}.reviewer{fill:#e8f5ef;stroke:#45816a}.tools,.records{fill:#edf1f3}.arrow{fill:none;stroke:#526b7b;stroke-width:2}marker path{fill:#526b7b}.return{fill:#963b3b;font-size:17px;font-weight:700}
</style>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z"/></marker></defs>
<g data-context="owner" transform="translate(30 20)"><rect width="350" height="155" rx="6" class="node owner"/><text x="16" y="31" class="title"><tspan x="16" dy="0">Human owner</tspan></text><text x="16" y="58" class="count"><tspan x="16" dy="0">Human, not an agent</tspan></text><text x="16" y="91" class="body"><tspan x="16" dy="0">Decides scope and required approvals</tspan></text></g>
<g data-role="pm" transform="translate(600 20)"><rect width="650" height="155" rx="6" class="node pm"/><text x="16" y="31" class="title"><tspan x="16" dy="0">PM / Coordinator</tspan></text><text x="16" y="58" class="count"><tspan x="16" dy="0">Coordination</tspan></text><text x="16" y="91" class="body"><tspan x="16" dy="0">Delegates work; secures access; runs approved deploys</tspan></text></g>
<path d="M382 65 H598" class="arrow" marker-end="url(#head)" marker-start="url(#tail)"/><text x="406" y="53" class="edge">Ask / decide</text>
<text x="406" y="113" class="note"><tspan x="406" dy="0">Human authority</tspan></text>
<text x="30" y="214" class="title"><tspan x="30" dy="0">PM does not do specialist work. Six roles are not six permanent sessions.</tspan></text>
<path d="M925 178 V270 H150 V316" class="arrow" marker-end="url(#head)" marker-start="url(#tail)"/><text x="30" y="250" class="edge">Assignment: scope + revision + skill; explicit reading + ACK before work</text>
<path d="M925 270 H1130" class="arrow"/>
<path d="M395 270 V316" class="arrow" marker-end="url(#head)"/><text x="0" y="0" class="edge"></text><path d="M640 270 V316" class="arrow" marker-end="url(#head)"/><text x="0" y="0" class="edge"></text><path d="M885 270 V316" class="arrow" marker-end="url(#head)"/><text x="0" y="0" class="edge"></text><path d="M1130 270 V316" class="arrow" marker-end="url(#head)"/><text x="0" y="0" class="edge"></text>
<g data-role="ba" transform="translate(30 320)"><rect width="240" height="208" rx="6" class="node ba"/><text x="16" y="31" class="title"><tspan x="16" dy="0">Business Analyst</tspan></text><text x="16" y="58" class="count"><tspan x="16" dy="0">On assigned scope</tspan></text><text x="16" y="91" class="body"><tspan x="16" dy="0">Establishes source-backed</tspan><tspan x="16" dy="23">behavior and requirements</tspan></text></g><g data-role="ux" transform="translate(275 320)"><rect width="240" height="208" rx="6" class="node ux"/><text x="16" y="31" class="title"><tspan x="16" dy="0">UX Designer</tspan></text><text x="16" y="58" class="count"><tspan x="16" dy="0">On assigned scope</tspan></text><text x="16" y="91" class="body"><tspan x="16" dy="0">Designs journeys, screens</tspan><tspan x="16" dy="23">and the shared UI</tspan><tspan x="16" dy="23">baseline</tspan></text></g><g data-role="architect" transform="translate(520 320)"><rect width="240" height="208" rx="6" class="node architect"/><text x="16" y="31" class="title"><tspan x="16" dy="0">Architect</tspan></text><text x="16" y="58" class="count"><tspan x="16" dy="0">On assigned scope</tspan></text><text x="16" y="91" class="body"><tspan x="16" dy="0">Owns architecture,</tspan><tspan x="16" dy="23">knowledge and integrated</tspan><tspan x="16" dy="23">SDD</tspan></text></g><g data-role="developer" transform="translate(765 320)"><rect width="240" height="208" rx="6" class="node developer"/><text x="16" y="31" class="title"><tspan x="16" dy="0">Developer</tspan></text><text x="16" y="58" class="count"><tspan x="16" dy="0">On assigned scope</tspan></text><text x="16" y="91" class="body"><tspan x="16" dy="0">Implements, tests and</tspan><tspan x="16" dy="23">performs permitted</tspan><tspan x="16" dy="23">delivery</tspan></text></g><g data-role="qa" transform="translate(1010 320)"><rect width="240" height="208" rx="6" class="node qa"/><text x="16" y="31" class="title"><tspan x="16" dy="0">QA</tspan></text><text x="16" y="58" class="count"><tspan x="16" dy="0">On assigned scope</tspan></text><text x="16" y="91" class="body"><tspan x="16" dy="0">Verifies UI and deployed</tspan><tspan x="16" dy="23">behavior against</tspan><tspan x="16" dy="23">expectations</tspan></text></g>
<text x="30" y="568" class="body"><tspan x="30" dy="0">RESULT to PM: session + skill version + files/snapshot + checks + gaps + next action.</tspan></text>
<path d="M30 595 H1250" stroke="#cbd6dc"/>
<text x="30" y="631" class="title"><tspan x="30" dy="0">Author / responsible-check sessions</tspan></text>
<text x="30" y="667" class="body"><tspan x="30" dy="0">Authors continue bounded work. Responsible checks:</tspan></text>
<text x="30" y="695" class="body"><tspan x="30" dy="0">3 BA; 12 Architect; 18 Developer. Not independent.</tspan></text>
<text x="680" y="631" class="title"><tspan x="680" dy="0">Fresh instances of the same specializations</tspan></text>
<text x="680" y="667" class="body"><tspan x="680" dy="0">2 BA; 7 QA; 10/14/16 Architect; 17 Developer; 19 QA.</tspan></text>
<text x="680" y="695" class="body"><tspan x="680" dy="0">2: full-blind or eligible correction-validation.</tspan></text>
<text x="680" y="720" class="note"><tspan x="680" dy="0">19: blind A then B; final: other-vendor agents.</tspan></text>
<text x="30" y="759" class="return"><tspan x="30" dy="0">Return: scoped author corrections, not a restart. Required fresh review remains separate.</tspan></text>
<g data-context="tools" transform="translate(30 792)"><rect width="455" height="140" rx="6" class="node tools"/><text x="16" y="31" class="title"><tspan x="16" dy="0">Automated gates / tools</tspan></text><text x="16" y="58" class="count"><tspan x="16" dy="0">Programs, not agents</tspan></text><text x="16" y="91" class="body"><tspan x="16" dy="0">Run the configured audits, tests and permitted</tspan><tspan x="16" dy="23">checks</tspan></text></g>
<g data-context="records" transform="translate(510 792)"><rect width="740" height="140" rx="6" class="node records"/><text x="16" y="31" class="title"><tspan x="16" dy="0">Versioned project records</tspan></text><text x="16" y="58" class="count"><tspan x="16" dy="0">Durable shared context</tspan></text><text x="16" y="91" class="body"><tspan x="16" dy="0">Instructions, status, approved inputs, artifacts, code and review evidence</tspan></text></g>
</svg>
