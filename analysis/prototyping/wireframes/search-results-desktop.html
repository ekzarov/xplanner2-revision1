<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search results: Story 2 - Planner</title>
  <style>
    /* Foundation resets & tokens */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #F7F8FA;
      color: #1D2125;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Focus styling */
    :focus-visible {
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
    }

    /* Skip link */
    .skip-link {
      position: absolute;
      top: -9999px;
      left: 16px;
      background: #0C66E4;
      color: #FFFFFF;
      padding: 8px 16px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      border-radius: 6px;
      z-index: 1000;
    }

    .skip-link:focus {
      top: 10px;
    }

    /* Top bar */
    .top-bar {
      height: 56px;
      background-color: #FFFFFF;
      border-bottom: 1px solid #DCDFE4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      color: #1D2125;
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .search-form {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-label {
      font-size: 14px;
      color: #1D2125;
      font-weight: 400;
      white-space: nowrap;
    }

    .search-input {
      font-family: inherit;
      font-size: 14px;
      color: #1D2125;
      height: 36px;
      width: 200px;
      padding: 0 12px;
      background-color: #FFFFFF;
      border: 1px solid #8590A2;
      border-radius: 6px;
    }

    .search-input:focus {
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
      border-color: #0C66E4;
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-link {
      color: #0C66E4;
      text-decoration: none;
      font-size: 14px;
      border-radius: 4px;
    }

    .nav-link:hover {
      text-decoration: underline;
    }

    /* Main container */
    main {
      padding: 24px;
      max-width: 1400px;
    }

    /* Breadcrumbs */
    .breadcrumb-nav {
      margin-bottom: 20px;
    }

    .breadcrumb-list {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .breadcrumb-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .breadcrumb-item + .breadcrumb-item::before {
      content: "/";
      color: #626F86;
    }

    .breadcrumb-link {
      color: #0C66E4;
      text-decoration: none;
      border-radius: 2px;
    }

    .breadcrumb-link:hover {
      text-decoration: underline;
    }

    .breadcrumb-current {
      color: #1D2125;
    }

    /* Heading */
    .page-heading {
      font-size: 24px;
      font-weight: 700;
      color: #1D2125;
      margin-bottom: 24px;
      letter-spacing: -0.01em;
    }

    /* Results Table */
    .table-container {
      background-color: #FFFFFF;
      border: 1px solid #DCDFE4;
      border-radius: 6px;
      overflow: hidden;
    }

    .results-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    .results-table th {
      background-color: #F1F2F4;
      color: #1D2125;
      font-weight: 600;
      height: 40px;
      padding: 0 16px;
      border-bottom: 1px solid #DCDFE4;
      white-space: nowrap;
    }

    .results-table th button {
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #1D2125;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 4px;
    }

    .results-table th button:hover {
      color: #0C66E4;
    }

    .results-table td {
      height: 40px;
      padding: 0 16px;
      border-bottom: 1px solid #DCDFE4;
      color: #1D2125;
      vertical-align: middle;
    }

    .results-table tr:last-child td {
      border-bottom: none;
    }

    .item-link {
      color: #0C66E4;
      text-decoration: none;
      border-radius: 2px;
    }

    .item-link:hover {
      text-decoration: underline;
    }

    /* Results summary */
    .results-count {
      margin-top: 16px;
      font-size: 14px;
      color: #626F86;
    }
  </style>
</head>
<body>
  <!-- Accessible Skip Link -->
  <a href="#main" class="skip-link">Skip to main content</a>

  <!-- Top bar -->
  <header class="top-bar">
    <div class="top-bar-left">
      <span class="brand-title">Planner</span>
      <form class="search-form" role="search" onsubmit="event.preventDefault();">
        <label for="search-input" class="search-label">Search or ID</label>
        <input type="search" id="search-input" class="search-input" value="Story 2">
      </form>
    </div>
    <nav class="top-bar-right" aria-label="User navigation">
      <a href="#" class="nav-link">Me</a>
      <a href="#" class="nav-link">Sign out</a>
    </nav>
  </header>

  <!-- Main content area -->
  <main id="main">
    <!-- Breadcrumb navigation -->
    <nav class="breadcrumb-nav" aria-label="Breadcrumb">
      <ol class="breadcrumb-list">
        <li class="breadcrumb-item">
          <a href="#" class="breadcrumb-link">Top</a>
        </li>
        <li class="breadcrumb-item">
          <span class="breadcrumb-current" aria-current="page">Search</span>
        </li>
      </ol>
    </nav>

    <!-- Page Title -->
    <h1 class="page-heading">Search results: Story 2</h1>

    <!-- Search Results Table -->
    <div class="table-container">
      <table class="results-table" aria-label="Search results">
        <thead>
          <tr>
            <th scope="col" aria-sort="none">
              <button type="button">Type</button>
            </th>
            <th scope="col" aria-sort="none">
              <button type="button">ID</button>
            </th>
            <th scope="col" aria-sort="none">
              <button type="button">Title</button>
            </th>
            <th scope="col" aria-sort="none">
              <button type="button">Match</button>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Story</td>
            <td>102</td>
            <td><a href="#" class="item-link">Story 2</a></td>
            <td>&ldquo;Story 2&rdquo;</td>
          </tr>
          <tr>
            <td>Note</td>
            <td>31</td>
            <td><a href="#" class="item-link">Story 2</a></td>
            <td>&ldquo;...see Story 2...&rdquo;</td>
          </tr>
          <tr>
            <td>Task</td>
            <td>8</td>
            <td><a href="#" class="item-link">Task 8</a></td>
            <td>&ldquo;...part of Story 2...&rdquo;</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Results count note -->
    <div class="results-count">3 results</div>
  </main>
</body>
</html>
