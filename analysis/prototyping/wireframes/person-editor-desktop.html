<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_standard" name="shell-type"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={"darkMode":"class","theme":{"extend":{"colors":{"error":"#ba1a1a","on-surface":"#0e1c2f","on-error-container":"#93000a","surface-variant":"#d6e3fe","outline-variant":"#c2c6d7","surface-container-lowest":"#ffffff","on-surface-variant":"#424654","on-tertiary-fixed-variant":"#910909","inverse-primary":"#b0c6ff","on-background":"#0e1c2f","on-secondary-fixed-variant":"#005229","surface-container-highest":"#d6e3fe","on-secondary-container":"#15733f","on-error":"#ffffff","surface-container":"#e7eeff","inverse-on-surface":"#ebf1ff","tertiary-fixed":"#ffdad5","on-primary":"#ffffff","secondary-fixed":"#9df6b4","secondary-container":"#9df6b4","surface":"#f9f9ff","on-primary-fixed":"#001945","on-tertiary-container":"#ffebe8","surface-container-low":"#f0f3ff","secondary-fixed-dim":"#82d99a","background":"#f9f9ff","on-tertiary":"#ffffff","primary-fixed-dim":"#b0c6ff","outline":"#727786","tertiary-container":"#c8362b","tertiary":"#a51c16","surface-bright":"#f9f9ff","on-tertiary-fixed":"#410001","tertiary-fixed-dim":"#ffb4aa","on-primary-fixed-variant":"#00429b","primary":"#004fb6","on-secondary":"#ffffff","on-secondary-fixed":"#00210d","secondary":"#086d39","primary-container":"#0c66e4","surface-container-high":"#dee8ff","on-primary-container":"#ecefff","surface-dim":"#cddbf5","error-container":"#ffdad6","primary-fixed":"#d9e2ff","surface-tint":"#0058ca","inverse-surface":"#243145"},"borderRadius":{"DEFAULT":"0.125rem","lg":"0.25rem","xl":"0.5rem","full":"0.75rem"},"spacing":{},"fontFamily":{"headline":["Inter"],"displa <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/></head><body class="bg-background font-body text-on-surface antialiased"><header class="fixed top-0 left-0 right-0 z-50 bg-surface-container-lowest border-b border-outline-variant"><div class="h-14 w-full px-6 flex items-center justify-between"><div class="flex items-center gap-6"><span class="text-base font-semibold text-on-surface tracking-tight">Planner</span><div class="flex items-center gap-2"><label class="text-sm font-normal text-on-surface-variant whitespace-nowrap" for="shell-search">Search or ID</label><input class="h-9 w-64 px-3 rounded text-sm text-on-surface bg-surface-container-lowest border border-outline focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2" id="shell-search" placeholder="Search tasks, IDs..." type="text"/></div></div><nav class="flex items-center gap-6" data-active-classes="text-primary-container font-semibold underline"><a aria-current="page" class="text-primary-container font-semibold underline" data-path="my-profile" href="#">Me</a><a class="text-sm font-normal text-primary-container hover:underline" data-path="sign-in" href="#">Sign out</a></nav></div></header><main class="w-full pt-14 bg-background min-h-screen"><div class="flex flex-col w-full">
<!-- Material Lean Breadcrumbs Area -->
<div class="w-full px-6 py-3 border-b border-[#DCDFE4] bg-surface-container-lowest">
<nav aria-label="Breadcrumb">
<ol class="flex items-center gap-1.5 text-[14px] leading-tight">
<li>
<a class="text-primary hover:underline focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 rounded-[2px]" href="#">Top</a>
</li>
<li aria-hidden="true" class="text-[#626F86]">/</li>
<li>
<a class="text-primary hover:underline focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 rounded-[2px]" href="#">People</a>
</li>
<li aria-hidden="true" class="text-[#626F86]">/</li>
<li>
<a class="text-primary hover:underline focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 rounded-[2px]" href="#">User A</a>
</li>
<li aria-hidden="true" class="text-[#626F86]">/</li>
<li aria-current="page" class="text-[#1D2125]">Edit</li>
</ol>
</nav>
</div>
<!-- Page Content Container -->
<div class="w-full px-6 py-6 flex flex-col">
<!-- Page Heading -->
<h1 class="text-[24px] font-semibold leading-normal text-[#1D2125] mb-6">
      Edit person: User A
    </h1>
<!-- Form Section Canvas (640px wide, Flat, Light theme) -->
<div class="w-full max-w-[640px] bg-surface-container-lowest border border-[#DCDFE4] rounded-[6px] p-6 mb-6">
<form class="flex flex-col gap-5" id="edit-person-form" onsubmit="event.preventDefault();">
<!-- Name Field -->
<div class="flex flex-col gap-1.5">
<label class="text-[16px] font-normal leading-normal text-[#1D2125]" for="field-name">
            Name (required)
          </label>
<input class="h-9 px-3 text-[16px] leading-normal text-[#1D2125] bg-surface-container-lowest border border-[#8590A2] rounded-[6px] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" id="field-name" name="name" required="" type="text" value="User A"/>
</div>
<!-- User ID Field -->
<div class="flex flex-col gap-1.5">
<label class="text-[16px] font-normal leading-normal text-[#1D2125]" for="field-userid">
            User ID (required)
          </label>
<input class="h-9 px-3 text-[16px] leading-normal text-[#1D2125] bg-surface-container-lowest border border-[#8590A2] rounded-[6px] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" id="field-userid" name="userid" required="" type="text" value="usera"/>
</div>
<!-- Initials Field -->
<div class="flex flex-col gap-1.5">
<label class="text-[16px] font-normal leading-normal text-[#1D2125]" for="field-initials">
            Initials (required)
          </label>
<input class="h-9 px-3 text-[16px] leading-normal text-[#1D2125] bg-surface-container-lowest border border-[#8590A2] rounded-[6px] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" id="field-initials" name="initials" required="" type="text" value="UA"/>
</div>
<!-- E-mail Field -->
<div class="flex flex-col gap-1.5">
<label class="text-[16px] font-normal leading-normal text-[#1D2125]" for="field-email">
            E-mail (required)
          </label>
<input class="h-9 px-3 text-[16px] leading-normal text-[#1D2125] bg-surface-container-lowest border border-[#8590A2] rounded-[6px] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" id="field-email" name="email" required="" type="email" value="usera@example.test"/>
</div>
<!-- Phone Field -->
<div class="flex flex-col gap-1.5">
<label class="text-[16px] font-normal leading-normal text-[#1D2125]" for="field-phone">
            Phone
          </label>
<input class="h-9 px-3 text-[16px] leading-normal text-[#1D2125] bg-surface-container-lowest border border-[#8590A2] rounded-[6px] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" id="field-phone" name="phone" type="tel" value="000-0001"/>
</div>
<!-- New password Field -->
<div class="flex flex-col gap-1.5">
<label class="text-[16px] font-normal leading-normal text-[#1D2125]" for="field-new-password">
            New password
          </label>
<input autocomplete="new-password" class="h-9 px-3 text-[16px] leading-normal text-[#1D2125] bg-surface-container-lowest border border-[#8590A2] rounded-[6px] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" id="field-new-password" name="new_password" type="password"/>
</div>
<!-- Confirm password Field -->
<div class="flex flex-col gap-1.5">
<label class="text-[16px] font-normal leading-normal text-[#1D2125]" for="field-confirm-password">
            Confirm password
          </label>
<input autocomplete="new-password" class="h-9 px-3 text-[16px] leading-normal text-[#1D2125] bg-surface-container-lowest border border-[#8590A2] rounded-[6px] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" id="field-confirm-password" name="confirm_password" type="password"/>
</div>
<!-- Deactivated Checkbox with Hint -->
<div class="pt-1 flex flex-col gap-1">
<div class="flex items-center gap-2">
<input class="w-4 h-4 rounded-[3px] border border-[#8590A2] text-primary focus:ring-2 focus:ring-primary focus:ring-offset-2 cursor-pointer" id="field-deactivated" name="deactivated" type="checkbox"/>
<label class="text-[16px] font-normal leading-normal text-[#1D2125] cursor-pointer" for="field-deactivated">
              Deactivated
            </label>
</div>
<p class="text-[14px] leading-normal text-[#626F86] pl-6">
            A deactivated person cannot sign in or take new assignments; time and history are kept.
          </p>
</div>
<!-- Project Roles Section -->
<div class="pt-3 flex flex-col gap-2">
<h2 class="text-[20px] font-semibold leading-normal text-[#1D2125]">
            Project roles
          </h2>
<table class="w-full border-collapse border border-[#DCDFE4] text-left text-[14px]">
<thead>
<tr class="bg-[#F1F2F4] border-b border-[#DCDFE4] h-10">
<th class="px-3 font-semibold text-[#1D2125] w-1/2" scope="col">Project</th>
<th class="px-3 font-semibold text-[#1D2125] w-1/2" scope="col">Role</th>
</tr>
</thead>
<tbody>
<!-- Row 1 -->
<tr class="h-10 border-b border-[#DCDFE4]">
<td class="px-3 text-[#1D2125] align-middle">Project 1</td>
<td class="px-3 align-middle py-1">
<label class="sr-only" for="role-project-1">Role for Project 1</label>
<select class="h-9 w-full px-2 text-[14px] text-[#1D2125] bg-surface-container-lowest border border-[#8590A2] rounded-[6px] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" id="role-project-1" name="role_project_1">
<option value="None">None</option>
<option value="Viewer">Viewer</option>
<option selected="" value="Editor">Editor</option>
<option value="Admin">Admin</option>
</select>
</td>
</tr>
<!-- Row 2 -->
<tr class="h-10 border-b border-[#DCDFE4]">
<td class="px-3 text-[#1D2125] align-middle">Project 2</td>
<td class="px-3 align-middle py-1">
<label class="sr-only" for="role-project-2">Role for Project 2</label>
<select class="h-9 w-full px-2 text-[14px] text-[#1D2125] bg-surface-container-lowest border border-[#8590A2] rounded-[6px] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" id="role-project-2" name="role_project_2">
<option value="None">None</option>
<option selected="" value="Viewer">Viewer</option>
<option value="Editor">Editor</option>
<option value="Admin">Admin</option>
</select>
</td>
</tr>
<!-- Row 3 -->
<tr class="h-10">
<td class="px-3 text-[#1D2125] align-middle">Project 3</td>
<td class="px-3 align-middle py-1">
<label class="sr-only" for="role-project-3">Role for Project 3</label>
<select class="h-9 w-full px-2 text-[14px] text-[#1D2125] bg-surface-container-lowest border border-[#8590A2] rounded-[6px] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" id="role-project-3" name="role_project_3">
<option selected="" value="None">None</option>
<option value="Viewer">Viewer</option>
<option value="Editor">Editor</option>
<option value="Admin">Admin</option>
</select>
</td>
</tr>
</tbody>
</table>
</div>
<!-- System Administrator Checkbox -->
<div class="pt-1 flex items-center gap-2">
<input class="w-4 h-4 rounded-[3px] border border-[#8590A2] text-primary focus:ring-2 focus:ring-primary focus:ring-offset-2 cursor-pointer" id="field-sysadmin" name="system_administrator" type="checkbox"/>
<label class="text-[16px] font-normal leading-normal text-[#1D2125] cursor-pointer" for="field-sysadmin">
            System administrator
          </label>
</div>
</form>
</div>
<!-- Action Buttons Row (Left-aligned, 36px high, 6px radius) -->
<div class="flex items-center gap-3">
<!-- 1. Primary Save -->
<button class="h-9 px-4 bg-primary text-on-primary font-normal text-[16px] rounded-[6px] hover:bg-[#0055CC] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 cursor-pointer inline-flex items-center justify-center" form="edit-person-form" type="submit">
        Save
      </button>
<!-- 2. Neutral Reset -->
<button class="h-9 px-4 bg-surface-container-lowest border border-[#8590A2] text-[#1D2125] font-normal text-[16px] rounded-[6px] hover:bg-[#F1F2F4] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 cursor-pointer inline-flex items-center justify-center" form="edit-person-form" type="reset">
        Reset
      </button>
<!-- 3. Neutral Cancel -->
<button class="h-9 px-4 bg-surface-container-lowest border border-[#8590A2] text-[#1D2125] font-normal text-[16px] rounded-[6px] hover:bg-[#F1F2F4] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 cursor-pointer inline-flex items-center justify-center" onclick="window.history.back()" type="button">
        Cancel
      </button>
</div>
</div>
</div></main></body></html>
