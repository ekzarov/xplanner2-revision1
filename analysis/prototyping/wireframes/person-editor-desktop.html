<!-- Page Heading -->
<div class="px-8 pt-4 pb-6">
<h1 class="text-2xl font-semibold text-[#1D2125] m-0">Edit person: User A</h1>
</div>
<!-- Main Content Form -->
<main class="px-8 pb-12">
<div class="w-full max-w-[640px] bg-[#FFFFFF] border border-[#DCDFE4] rounded-[6px] p-8">
<form action="#" method="post" novalidate="" onsubmit="return false;">
<div class="flex flex-col gap-4">
<!-- Name (required) -->
<div class="flex flex-col">
<label class="text-base font-medium text-[#1D2125] mb-1" for="name">Name (required)</label>
<input class="h-9 w-full bg-[#FFFFFF] border border-[#8590A2] rounded-[6px] px-3 text-base text-[#1D2125]" id="name" name="name" required="" type="text" value="User A"/>
</div>
<!-- User ID (required) -->
<div class="flex flex-col">
<label class="text-base font-medium text-[#1D2125] mb-1" for="user-id">User ID (required)</label>
<input class="h-9 w-full bg-[#FFFFFF] border border-[#8590A2] rounded-[6px] px-3 text-base text-[#1D2125]" id="user-id" name="userId" required="" type="text" value="usera"/>
</div>
<!-- Initials (required) -->
<div class="flex flex-col">
<label class="text-base font-medium text-[#1D2125] mb-1" for="initials">Initials (required)</label>
<input class="h-9 w-full bg-[#FFFFFF] border border-[#8590A2] rounded-[6px] px-3 text-base text-[#1D2125]" id="initials" name="initials" required="" type="text" value="UA"/>
</div>
<!-- E-mail (required) -->
<div class="flex flex-col">
<label class="text-base font-medium text-[#1D2125] mb-1" for="email">E-mail (required)</label>
<input class="h-9 w-full bg-[#FFFFFF] border border-[#8590A2] rounded-[6px] px-3 text-base text-[#1D2125]" id="email" name="email" required="" type="email" value="usera@example.test"/>
</div>
<!-- Phone -->
<div class="flex flex-col">
<label class="text-base font-medium text-[#1D2125] mb-1" for="phone">Phone</label>
<input class="h-9 w-full bg-[#FFFFFF] border border-[#8590A2] rounded-[6px] px-3 text-base text-[#1D2125]" id="phone" name="phone" type="tel" value="000-0001"/>
</div>
<!-- New password -->
<div class="flex flex-col">
<label class="text-base font-medium text-[#1D2125] mb-1" for="new-password">New password</label>
<input class="h-9 w-full bg-[#FFFFFF] border border-[#8590A2] rounded-[6px] px-3 text-base text-[#1D2125]" id="new-password" name="newPassword" type="password"/>
</div>
<!-- Confirm password -->
<div class="flex flex-col">
<label class="text-base font-medium text-[#1D2125] mb-1" for="confirm-password">Confirm password</label>
<input class="h-9 w-full bg-[#FFFFFF] border border-[#8590A2] rounded-[6px] px-3 text-base text-[#1D2125]" id="confirm-password" name="confirmPassword" type="password"/>
</div>
<!-- Deactivated Checkbox -->
<div class="pt-2">
<div class="flex items-center">
<input class="w-4 h-4 text-[#0C66E4] border-[#8590A2] rounded-[6px] cursor-pointer" id="deactivated" name="deactivated" type="checkbox"/>
<label class="ml-2 text-base font-medium text-[#1D2125] cursor-pointer select-none" for="deactivated">
                Deactivated
              </label>
</div>
<p class="mt-1 text-sm text-[#626F86] ml-6 m-0 leading-normal">
              A deactivated person cannot sign in or take new assignments; time and history are kept.
            </p>
</div>

<div class="mt-6 mb-1">
<h2 class="text-xl font-semibold text-[#1D2125] m-0 mb-3">Project roles</h2>
<table class="w-full border border-[#DCDFE4] border-collapse text-left">
<thead>
<tr class="h-10 bg-[#F1F2F4] border-b border-[#DCDFE4]">

<th class="px-3 text-sm font-semibold text-[#1D2125]" scope="col">Role</th>
</tr>
</thead>
<tbody>
<tr class="h-10 border-b border-[#DCDFE4]">
<td class="px-3 text-sm text-[#1D2125]">Project 1</td>
<td class="px-3">
<select class="h-8 w-36 bg-[#FFFFFF] border border-[#8590A2] rounded-[6px] px-2 text-sm text-[#1D2125]">
<option value="none">None</option>
<option value="viewer">Viewer</option>
<option selected="" value="editor">Editor</option>
<option value="admin">Admin</option>
</select>
</td>
</tr>
<tr class="h-10 border-b border-[#DCDFE4]">

<option value="editor">Editor</option>

<option value="editor">Editor</option>
<option value="admin">Admin</option>
</select>
</td>
</tr>
