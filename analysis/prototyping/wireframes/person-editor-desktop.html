<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit person: User A - Planner</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #F7F8FA;
      color: #1D2125;
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Accessibility Skip Link */
    .skip-link {
      position: absolute;
      top: -9999px;
      left: 16px;
      background: #0C66E4;
      color: #FFFFFF;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      z-index: 1000;
      text-decoration: none;
    }
    .skip-link:focus {
      top: 10px;
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
    }

    /* Top bar */
    .top-bar {
      height: 56px;
      background-color: #FFFFFF;
      border-bottom: 1px solid #DCDFE4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      color: #1D2125;
      text-decoration: none;
    }

    .search-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-label {
      font-size: 14px;
      color: #1D2125;
      white-space: nowrap;
    }

    .search-input {
      width: 240px;
      height: 36px;
      background-color: #FFFFFF;
      border: 1px solid #8590A2;
      border-radius: 6px;
      padding: 0 12px;
      font-size: 14px;
      color: #1D2125;
      font-family: inherit;
    }
    .search-input:focus {
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .top-link {
      color: #0C66E4;
      text-decoration: none;
      font-size: 14px;
    }
    .top-link:hover {
      text-decoration: underline;
    }
    .top-link:focus {
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* Breadcrumb */
    .breadcrumb-nav {
      padding: 24px 32px 0 32px;
    }

    .breadcrumb-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .breadcrumb-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .breadcrumb-item:not(:last-child)::after {
      content: "/";
      color: #626F86;
    }

    .breadcrumb-link {
      color: #0C66E4;
      text-decoration: none;
    }
    .breadcrumb-link:hover {
      text-decoration: underline;
    }
    .breadcrumb-link:focus {
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
      border-radius: 2px;
    }

    .breadcrumb-current {
      color: #1D2125;
    }

    /* Main Container */
    main {
      padding: 16px 32px 48px 32px;
      flex: 1;
    }

    .page-title {
      font-size: 24px;
      font-weight: 600;
      color: #1D2125;
      margin-bottom: 24px;
    }

    /* Form Surface */
    .form-container {
      max-width: 640px;
      background-color: #FFFFFF;
      border: 1px solid #DCDFE4;
      border-radius: 6px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 16px;
      font-weight: 500;
      color: #1D2125;
    }

    .text-input,
    .select-input {
      width: 100%;
      height: 36px;
      background-color: #FFFFFF;
      border: 1px solid #8590A2;
      border-radius: 6px;
      padding: 0 12px;
      font-size: 16px;
      color: #1D2125;
      font-family: inherit;
    }
    .text-input:focus,
    .select-input:focus {
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
    }

    .select-input {
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2212%22%20height%3D%228%22%20viewBox%3D%220%200%2012%208%22%3E%3Cpath%20fill%3D%22%231D2125%22%20d%3D%22M1.41%200L6%204.58L10.59%200L12%201.41l-6%206l-6-6z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      padding-right: 36px;
    }

    /* Checkbox Group */
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 500;
      color: #1D2125;
      cursor: pointer;
      user-select: none;
    }

    .native-checkbox {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #0C66E4;
      border: 1px solid #8590A2;
      border-radius: 2px;
    }
    .native-checkbox:focus {
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
    }

    .checkbox-hint {
      font-size: 14px;
      color: #626F86;
      margin-left: 24px;
    }

    /* Section Heading & Table */
    .section-heading {
      font-size: 20px;
      font-weight: 600;
      color: #1D2125;
      margin-top: 4px;
      margin-bottom: 8px;
    }

    .roles-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 16px;
    }

    .roles-table th {
      background-color: #F1F2F4;
      color: #1D2125;
      font-weight: 600;
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid #DCDFE4;
    }

    .roles-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #DCDFE4;
      vertical-align: middle;
      color: #1D2125;
    }

    .roles-table td:first-child {
      width: 40%;
    }

    .roles-table .select-input {
      max-width: 180px;
    }

    /* Form Actions */
    .form-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
    }

    .btn {
      height: 36px;
      padding: 0 16px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border: 1px solid transparent;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .btn:focus {
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
    }

    .btn-primary {
      background-color: #0C66E4;
      color: #FFFFFF;
      border-color: #0C66E4;
    }
    .btn-primary:hover {
      background-color: #0055CC;
      border-color: #0055CC;
    }

    .btn-neutral {
      background-color: #FFFFFF;
      color: #1D2125;
      border-color: #8590A2;
    }
    .btn-neutral:hover {
      background-color: #F7F8FA;
    }
  </style>
</head>
<body>
  <!-- Accessible Skip Link -->
  <a href="#main" class="skip-link">Skip to main content</a>

  <!-- Top bar -->
  <header class="top-bar">
    <div class="top-bar-left">
      <a href="#" class="brand">Planner</a>
      <div class="search-container">
        <label for="search-input" class="search-label">Search or ID</label>
        <input type="text" id="search-input" class="search-input">
      </div>
    </div>
    <div class="top-bar-right">
      <a href="#" class="top-link">System information</a>
      <a href="#" class="top-link">Me</a>
      <a href="#" class="top-link">Sign out</a>
    </div>
  </header>

  <!-- Breadcrumb -->
  <nav class="breadcrumb-nav" aria-label="Breadcrumb">
    <ol class="breadcrumb-list">
      <li class="breadcrumb-item">
        <a href="#" class="breadcrumb-link">Top</a>
      </li>
      <li class="breadcrumb-item">
        <a href="#" class="breadcrumb-link">People</a>
      </li>
      <li class="breadcrumb-item">
        <a href="#" class="breadcrumb-link">User A</a>
      </li>
      <li class="breadcrumb-item">
        <span class="breadcrumb-current" aria-current="page">Edit</span>
      </li>
    </ol>
  </nav>

  <!-- Main Content -->
  <main id="main">
    <h1 class="page-title">Edit person: User A</h1>

    <div class="form-container">
      <form action="#" method="post" onsubmit="return false;">
        <!-- Name -->
        <div class="form-group" style="margin-bottom: 20px;">
          <label for="field-name" class="field-label">Name (required)</label>
          <input type="text" id="field-name" class="text-input" value="User A" required>
        </div>

        <!-- User ID -->
        <div class="form-group" style="margin-bottom: 20px;">
          <label for="field-userid" class="field-label">User ID (required)</label>
          <input type="text" id="field-userid" class="text-input" value="usera" required>
        </div>

        <!-- Initials -->
        <div class="form-group" style="margin-bottom: 20px;">
          <label for="field-initials" class="field-label">Initials (required)</label>
          <input type="text" id="field-initials" class="text-input" value="UA" required>
        </div>

        <!-- E-mail -->
        <div class="form-group" style="margin-bottom: 20px;">
          <label for="field-email" class="field-label">E-mail (required)</label>
          <input type="email" id="field-email" class="text-input" value="usera@example.test" required>
        </div>

        <!-- Phone -->
        <div class="form-group" style="margin-bottom: 20px;">
          <label for="field-phone" class="field-label">Phone</label>
          <input type="tel" id="field-phone" class="text-input" value="000-0001">
        </div>

        <!-- New password -->
        <div class="form-group" style="margin-bottom: 20px;">
          <label for="field-new-password" class="field-label">New password</label>
          <input type="password" id="field-new-password" class="text-input" value="" autocomplete="new-password">
        </div>

        <!-- Confirm password -->
        <div class="form-group" style="margin-bottom: 20px;">
          <label for="field-confirm-password" class="field-label">Confirm password</label>
          <input type="password" id="field-confirm-password" class="text-input" value="" autocomplete="new-password">
        </div>

        <!-- Deactivated Checkbox -->
        <div class="checkbox-group" style="margin-bottom: 24px;">
          <label class="checkbox-label" for="field-deactivated">
            <input type="checkbox" id="field-deactivated" class="native-checkbox">
            Deactivated
          </label>
          <div class="checkbox-hint">A deactivated person cannot sign in or take new assignments; time and history are kept.</div>
        </div>

        <!-- Project Roles Section -->
        <div style="margin-bottom: 24px;">
          <h2 class="section-heading">Project roles</h2>
          <table class="roles-table">
            <thead>
              <tr>
                <th scope="col">Project</th>
                <th scope="col">Role</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Project 1</td>
                <td>
                  <label for="role-project-1" class="visually-hidden" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;">Project 1 Role</label>
                  <select id="role-project-1" class="select-input">
                    <option value="None">None</option>
                    <option value="Viewer">Viewer</option>
                    <option value="Editor" selected>Editor</option>
                    <option value="Admin">Admin</option>
                  </select>
                </td>
              </tr>
              <tr>
                <td>Project 2</td>
                <td>
                  <label for="role-project-2" class="visually-hidden" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;">Project 2 Role</label>
                  <select id="role-project-2" class="select-input">
                    <option value="None">None</option>
                    <option value="Viewer" selected>Viewer</option>
                    <option value="Editor">Editor</option>
                    <option value="Admin">Admin</option>
                  </select>
                </td>
              </tr>
              <tr>
                <td>Project 3</td>
                <td>
                  <label for="role-project-3" class="visually-hidden" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;">Project 3 Role</label>
                  <select id="role-project-3" class="select-input">
                    <option value="None" selected>None</option>
                    <option value="Viewer">Viewer</option>
                    <option value="Editor">Editor</option>
                    <option value="Admin">Admin</option>
                  </select>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- System Administrator Checkbox -->
        <div class="checkbox-group" style="margin-bottom: 24px;">
          <label class="checkbox-label" for="field-sysadmin">
            <input type="checkbox" id="field-sysadmin" class="native-checkbox">
            System administrator
          </label>
        </div>

        <!-- Form Buttons -->
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="reset" class="btn btn-neutral">Reset</button>
          <button type="button" class="btn btn-neutral">Cancel</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
