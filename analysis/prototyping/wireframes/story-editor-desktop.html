<body class="min-h-screen bg-[#F7F8FA] text-[#1D2125] text-base leading-normal">

<header class="w-full bg-[#FFFFFF] border-b border-[#DCDFE4] h-14">
<div class="max-w-[1200px] h-full mx-auto px-6 flex items-center justify-between">

<!-- Page Heading -->
<h1 class="text-2xl font-semibold text-[#1D2125] mb-6">Edit story: Story 2</h1>
<!-- Form Section -->
<section class="max-w-[640px] bg-[#FFFFFF] border border-[#DCDFE4] rounded-[6px] p-8 mb-8">
<form action="#" class="space-y-5" method="POST">
<!-- Field a: Name (required) -->
<div>
<label class="block text-base font-semibold text-[#1D2125] mb-2" for="story-name">Name (required)</label>
<input class="w-full h-9 rounded-[6px] border border-[#8590A2] bg-[#FFFFFF] px-3 text-base text-[#1D2125] focus:outline-none focus:ring-2 focus:ring-[#0C66E4] focus:ring-offset-2" id="story-name" name="name" required="" type="text" value="Story 2"/>
</div>
<!-- Field b: Disposition -->
<div>
<label class="block text-base font-semibold text-[#1D2125] mb-2" for="story-disposition">Disposition</label>
<select class="w-full h-9 rounded-[6px] border border-[#8590A2] bg-[#FFFFFF] px-3 text-base text-[#1D2125] focus:outline-none focus:ring-2 focus:ring-[#0C66E4] focus:ring-offset-2" id="story-disposition" name="disposition">
<option selected="" value="Planned">Planned</option>
<option value="Carried over">Carried over</option>
<option value="Added">Added</option>
</select>
</div>
<!-- Field c: Status -->
<div>
<label class="block text-base font-semibold text-[#1D2125] mb-2" for="story-status">Status</label>
<select class="w-full h-9 rounded-[6px] border border-[#8590A2] bg-[#FFFFFF] px-3 text-base text-[#1D2125] focus:outline-none focus:ring-2 focus:ring-[#0C66E4] focus:ring-offset-2" id="story-status" name="status">
<option selected="" value="Draft">Draft</option>
<option value="In progress">In progress</option>
<option value="Completed">Completed</option>
<option value="Accepted">Accepted</option>
</select>
</div>
<!-- Field d: Customer -->
<div>
<label class="block text-base font-semibold text-[#1D2125] mb-2" for="story-customer">Customer</label>
<select class="w-full h-9 rounded-[6px] border border-[#8590A2] bg-[#FFFFFF] px-3 text-base text-[#1D2125] focus:outline-none focus:ring-2 focus:ring-[#0C66E4] focus:ring-offset-2" id="story-customer" name="customer">
<option value="User A">User A</option>
<option value="User B">User B</option>
<option selected="" value="User C">User C</option>
<option value="User D">User D</option>
</select>
</div>
<!-- Field e: Tracker -->
<div>
<label class="block text-base font-semibold text-[#1D2125] mb-2" for="story-tracker">Tracker</label>
<select class="w-full h-9 rounded-[6px] border border-[#8590A2] bg-[#FFFFFF] px-3 text-base text-[#1D2125] focus:outline-none focus:ring-2 focus:ring-[#0C66E4] focus:ring-offset-2" id="story-tracker" name="tracker">
<option value="User A">User A</option>
<option selected="" value="User B">User B</option>
<option value="User C">User C</option>
<option value="User D">User D</option>
</select>
</div>
<!-- Field f: Priority -->
<div>
<label class="block text-base font-semibold text-[#1D2125] mb-2" for="story-priority">Priority</label>
<input class="w-full h-9 rounded-[6px] border border-[#8590A2] bg-[#FFFFFF] px-3 text-base text-[#1D2125] focus:outline-none focus:ring-2 focus:ring-[#0C66E4] focus:ring-offset-2" id="story-priority" name="priority" type="number" value="2"/>
</div>
<!-- Field g: Order -->
<div>
<label class="block text-base font-semibold text-[#1D2125] mb-2" for="story-order">Order</label>
<input class="w-full h-9 rounded-[6px] border border-[#8590A2] bg-[#FFFFFF] px-3 text-base text-[#1D2125] focus:outline-none focus:ring-2 focus:ring-[#0C66E4] focus:ring-offset-2" id="story-order" name="order" type="number" value="2"/>
</div>
<!-- Field h: Estimated hours -->
<div>
<label class="block text-base font-semibold text-[#1D2125] mb-2" for="story-estimated-hours">Estimated hours</label>
<input class="w-full h-9 rounded-[6px] border border-[#8590A2] bg-[#FFFFFF] px-3 text-base text-[#1D2125] focus:outline-none focus:ring-2 focus:ring-[#0C66E4] focus:ring-offset-2" id="story-estimated-hours" name="estimated_hours" step="0.1" type="number" value="24.0"/>
<p class="mt-1 text-sm text-[#626F86]">Hours, 0 or more</p>
</div>
<!-- Field i: Description -->
<div>
<label class="block text-base font-semibold text-[#1D2125] mb-2" for="story-description">Description</label>
<textarea class="w-full min-h-[110px] rounded-[6px] border border-[#8590A2] bg-[#FFFFFF] p-3 text-base text-[#1D2125] focus:outline-none focus:ring-2 focus:ring-[#0C66E4] focus:ring-offset-2" id="story-description" name="description" rows="4">Synthetic sample story.</textarea>
<!-- Field j: Primary text link below description -->
<div class="mt-1.5">
<a class="text-sm font-normal text-[#0C66E4] hover:underline focus:outline-none focus:ring-2 focus:ring-[#0C66E4] focus:ring-offset-2 rounded-[2px]" href="#formatting-help">Formatting help</a>
</div>
</div>
<!-- Form buttons -->
<div class="pt-4 flex items-center space-x-3">
<button class="h-9 px-5 rounded-[6px] bg-[#0C66E4] hover:bg-[#0055CC] text-[#FFFFFF] text-base font-medium focus:outline-none focus:ring-2 focus:ring-[#0C66E4] focus:ring-offset-2 transition-colors" type="submit">
            Save
          </button>
<button class="h-9 px-4 rounded-[6px] bg-[#FFFFFF] border border-[#8590A2] text-[#1D2125] text-base font-normal hover:bg-[#F1F2F4] focus:outline-none focus:ring-2 focus:ring-[#0C66E4] focus:ring-offset-2 transition-colors" type="reset">
            Reset
          </button>
<button class="h-9 px-4 rounded-[6px] bg-[#FFFFFF] border border-[#8590A2] text-[#1D2125] text-base font-normal hover:bg-[#F1F2F4] focus:outline-none focus:ring-2 focus:ring-[#0C66E4] focus:ring-offset-2 transition-colors" type="button">
            Cancel
          </button>
</div>
</form>
</section>
</main>
</body></html>
