<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UX13-36 Edit story: Story 2 - Planner</title>
  <style>
    /* Reset & Foundation tokens */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #F7F8FA;
      color: #1D2125;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Accessibility Skip Link */
    .skip-link {
      position: absolute;
      top: -9999px;
      left: 16px;
      background: #0C66E4;
      color: #FFFFFF;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 6px;
      text-decoration: none;
      z-index: 1000;
      outline: none;
    }
    .skip-link:focus {
      top: 10px;
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
    }

    /* Focus ring styles */
    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
    }

    /* Top navigation bar */
    .top-bar {
      height: 56px;
      background-color: #FFFFFF;
      border-bottom: 1px solid #DCDFE4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 700;
      color: #1D2125;
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .search-form {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-label {
      font-size: 14px;
      font-weight: 400;
      color: #1D2125;
    }

    .search-input {
      width: 200px;
      height: 36px;
      padding: 0 10px;
      font-family: inherit;
      font-size: 14px;
      color: #1D2125;
      background-color: #FFFFFF;
      border: 1px solid #8590A2;
      border-radius: 6px;
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .top-link {
      font-size: 14px;
      color: #0C66E4;
      text-decoration: none;
    }
    .top-link:hover {
      text-decoration: underline;
    }

    /* Main content container */
    main {
      padding: 24px 24px 48px;
      max-width: 1280px;
      width: 100%;
      margin: 0;
    }

    /* Breadcrumbs */
    .breadcrumb-nav {
      margin-bottom: 16px;
    }

    .breadcrumb-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      font-size: 14px;
      color: #626F86;
    }

    .breadcrumb-item {
      display: flex;
      align-items: center;
    }

    .breadcrumb-item:not(:last-child)::after {
      content: "/";
      margin: 0 8px;
      color: #626F86;
    }

    .breadcrumb-link {
      color: #0C66E4;
      text-decoration: none;
    }
    .breadcrumb-link:hover {
      text-decoration: underline;
    }

    .breadcrumb-current {
      color: #1D2125;
      font-weight: 400;
    }

    /* Page Heading */
    .page-heading {
      font-size: 24px;
      font-weight: 700;
      color: #1D2125;
      line-height: 1.25;
      margin-bottom: 24px;
    }

    /* Form Card Container */
    .form-card {
      background-color: #FFFFFF;
      border: 1px solid #DCDFE4;
      border-radius: 6px;
      width: 100%;
      max-width: 640px;
      padding: 24px;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }

    .field-label {
      font-size: 16px;
      font-weight: 400;
      color: #1D2125;
      margin-bottom: 6px;
      display: inline-block;
    }

    .field-input {
      width: 100%;
      height: 36px;
      padding: 0 12px;
      font-family: inherit;
      font-size: 16px;
      color: #1D2125;
      background-color: #FFFFFF;
      border: 1px solid #8590A2;
      border-radius: 6px;
    }

    .field-select {
      width: 100%;
      height: 36px;
      padding: 0 32px 0 12px;
      font-family: inherit;
      font-size: 16px;
      color: #1D2125;
      background-color: #FFFFFF;
      border: 1px solid #8590A2;
      border-radius: 6px;
      appearance: none;
      -webkit-appearance: none;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%23626F86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');
      background-repeat: no-repeat;
      background-position: right 10px center;
      cursor: pointer;
    }

    .field-hint {
      font-size: 12px;
      color: #626F86;
      margin-top: 4px;
    }

    .field-textarea {
      width: 100%;
      min-height: 120px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 16px;
      color: #1D2125;
      background-color: #FFFFFF;
      border: 1px solid #8590A2;
      border-radius: 6px;
      resize: vertical;
      line-height: 1.4;
    }

    .help-link-wrapper {
      margin-top: 6px;
    }

    .help-link {
      font-size: 14px;
      color: #0C66E4;
      text-decoration: none;
    }
    .help-link:hover {
      text-decoration: underline;
    }

    /* Actions */
    .form-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      height: 36px;
      padding: 0 16px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      text-decoration: none;
    }

    .btn-primary {
      background-color: #0C66E4;
      color: #FFFFFF;
      border-color: #0C66E4;
    }
    .btn-primary:hover {
      background-color: #0055CC;
      border-color: #0055CC;
    }

    .btn-neutral {
      background-color: #FFFFFF;
      color: #1D2125;
      border-color: #8590A2;
    }
    .btn-neutral:hover {
      background-color: #F7F8FA;
    }
  </style>
</head>
<body>
  <!-- Visually hidden skip link -->
  <a href="#main" class="skip-link">Skip to main content</a>

  <!-- Top bar -->
  <header class="top-bar">
    <div class="top-bar-left">
      <a href="#" class="brand-name">Planner</a>
      <form class="search-form" role="search" onsubmit="return false;">
        <label for="top-search" class="search-label">Search or ID</label>
        <input type="text" id="top-search" class="search-input">
      </form>
    </div>
    <div class="top-bar-right">
      <a href="#" class="top-link">Me</a>
      <a href="#" class="top-link">Sign out</a>
    </div>
  </header>

  <!-- Main content area -->
  <main id="main">
    <!-- Breadcrumb navigation -->
    <nav class="breadcrumb-nav" aria-label="Breadcrumb">
      <ol class="breadcrumb-list">
        <li class="breadcrumb-item"><a href="#" class="breadcrumb-link">Top</a></li>
        <li class="breadcrumb-item"><a href="#" class="breadcrumb-link">Project 1</a></li>
        <li class="breadcrumb-item"><a href="#" class="breadcrumb-link">Iteration 3</a></li>
        <li class="breadcrumb-item"><a href="#" class="breadcrumb-link">Story 2</a></li>
        <li class="breadcrumb-item"><span class="breadcrumb-current" aria-current="page">Edit</span></li>
      </ol>
    </nav>

    <!-- Page Heading -->
    <h1 class="page-heading">Edit story: Story 2</h1>

    <!-- Edit Story Form Card -->
    <div class="form-card">
      <form id="edit-story-form" onsubmit="return false;">
        <!-- Name -->
        <div class="form-group">
          <label for="story-name" class="field-label">Name (required)</label>
          <input type="text" id="story-name" name="name" class="field-input" value="Story 2" required>
        </div>

        <!-- Disposition -->
        <div class="form-group">
          <label for="story-disposition" class="field-label">Disposition</label>
          <select id="story-disposition" name="disposition" class="field-select">
            <option value="Planned" selected>Planned</option>
            <option value="Carried over">Carried over</option>
            <option value="Added">Added</option>
          </select>
        </div>

        <!-- Status -->
        <div class="form-group">
          <label for="story-status" class="field-label">Status</label>
          <select id="story-status" name="status" class="field-select">
            <option value="Draft" selected>Draft</option>
            <option value="In progress">In progress</option>
            <option value="Completed">Completed</option>
            <option value="Accepted">Accepted</option>
          </select>
        </div>

        <!-- Customer -->
        <div class="form-group">
          <label for="story-customer" class="field-label">Customer</label>
          <select id="story-customer" name="customer" class="field-select">
            <option value="User A">User A</option>
            <option value="User B">User B</option>
            <option value="User C" selected>User C</option>
            <option value="User D">User D</option>
          </select>
        </div>

        <!-- Tracker -->
        <div class="form-group">
          <label for="story-tracker" class="field-label">Tracker</label>
          <select id="story-tracker" name="tracker" class="field-select">
            <option value="User A">User A</option>
            <option value="User B" selected>User B</option>
            <option value="User C">User C</option>
            <option value="User D">User D</option>
          </select>
        </div>

        <!-- Priority -->
        <div class="form-group">
          <label for="story-priority" class="field-label">Priority</label>
          <input type="number" id="story-priority" name="priority" class="field-input" value="2">
        </div>

        <!-- Order -->
        <div class="form-group">
          <label for="story-order" class="field-label">Order</label>
          <input type="number" id="story-order" name="order" class="field-input" value="2">
        </div>

        <!-- Estimated hours -->
        <div class="form-group">
          <label for="story-estimate" class="field-label">Estimated hours</label>
          <input type="text" id="story-estimate" name="estimated_hours" class="field-input" value="24.0" aria-describedby="estimate-hint">
          <span id="estimate-hint" class="field-hint">Hours, 0 or more</span>
        </div>

        <!-- Description -->
        <div class="form-group">
          <label for="story-description" class="field-label">Description</label>
          <textarea id="story-description" name="description" class="field-textarea">Synthetic sample story.</textarea>
          <div class="help-link-wrapper">
            <a href="#" class="help-link">Formatting help</a>
          </div>
        </div>

        <!-- Action Buttons: Save, Reset, Cancel -->
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="reset" class="btn btn-neutral">Reset</button>
          <button type="button" class="btn btn-neutral" onclick="history.back()">Cancel</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
