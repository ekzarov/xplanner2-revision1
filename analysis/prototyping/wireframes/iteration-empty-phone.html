<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>UX13-18 Iteration 4 - No stories (Phone, Editor)</title>
<style>
    /* Reset & Base Foundation */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: #1D2125;
      background-color: #F7F8FA;
      width: 100%;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Accessibility Skip Link */
    .skip-link {
      position: absolute;
      top: -9999px;
      left: 16px;
      background: #0C66E4;
      color: #FFFFFF;
      padding: 8px 16px;
      font-weight: 500;
      border-radius: 0 0 6px 6px;
      z-index: 1000;
      text-decoration: none;
    }

    .skip-link:focus {
      top: 0;
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
    }

    /* Focus States */
    a:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
    }

    /* Top Bar */
    header {
      background-color: #FFFFFF;
      border-bottom: 1px solid #DCDFE4;
      padding: 12px 16px;
    }

    .top-bar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 36px;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      color: #1D2125;
      letter-spacing: -0.01em;
    }

    .top-nav-links {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .top-nav-links a {
      color: #0C66E4;
      text-decoration: none;
      font-size: 14px;
      font-weight: 400;
    }

    .top-nav-links a:hover {
      text-decoration: underline;
    }

    .search-container {
      margin-top: 10px;
    }

    .search-label {
      display: block;
      font-size: 14px;
      color: #1D2125;
      margin-bottom: 6px;
      font-weight: 400;
    }

    .search-input {
      width: 100%;
      height: 44px;
      border: 1px solid #8590A2;
      border-radius: 6px;
      padding: 0 12px;
      font-size: 16px;
      color: #1D2125;
      background: #FFFFFF;
    }

    /* Main Container */
    main {
      padding: 16px;
      max-width: 100%;
    }

    /* Breadcrumbs */
    .breadcrumb-nav {
      margin-bottom: 12px;
    }

    .breadcrumb-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      font-size: 14px;
    }

    .breadcrumb-item {
      display: inline-flex;
      align-items: center;
    }

    .breadcrumb-item + .breadcrumb-item::before {
      content: "/";
      margin: 0 6px;
      color: #626F86;
    }

    .breadcrumb-item a {
      color: #0C66E4;
      text-decoration: none;
    }

    .breadcrumb-item a:hover {
      text-decoration: underline;
    }

    .breadcrumb-item [aria-current="page"] {
      color: #1D2125;
      font-weight: 400;
    }

    /* Page Heading & Metrics */
    .page-title {
      font-size: 22px;
      font-weight: 600;
      color: #1D2125;
      line-height: 1.25;
      margin-bottom: 4px;
    }

    .date-range {
      font-size: 14px;
      color: #626F86;
      margin-bottom: 10px;
    }

    .metrics-summary {
      font-size: 14px;
      color: #626F86;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      align-items: center;
    }

    .metrics-summary .progress-val {
      color: #1D2125;
      font-weight: 500;
    }

    .metric-dot {
      color: #626F86;
    }

    /* Actions Stack */
    .page-actions-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 48px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-neutral {
      background-color: #FFFFFF;
      border: 1px solid #8590A2;
      color: #1D2125;
    }

    .btn-neutral:hover {
      background-color: #F1F2F4;
    }

    .btn-primary {
      background-color: #0C66E4;
      border: 1px solid #0C66E4;
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background-color: #0055CC;
    }

    /* Primary Links Row */
    .action-links-row {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
      font-size: 15px;
    }

    .action-links-row a {
      color: #0C66E4;
      text-decoration: none;
      font-weight: 400;
    }

    .action-links-row a:hover {
      text-decoration: underline;
    }

    /* Local Tabs */
    .tabs-wrapper {
      border-bottom: 1px solid #DCDFE4;
      overflow-x: auto;
      margin-left: -16px;
      margin-right: -16px;
      padding-left: 16px;
      padding-right: 16px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 24px;
    }

    .tabs-wrapper::-webkit-scrollbar {
      display: none;
    }

    .tabs-list {
      display: flex;
      gap: 20px;
      white-space: nowrap;
    }

    .tab-link {
      display: inline-block;
      padding: 10px 2px 12px 2px;
      color: #626F86;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      position: relative;
      border: none;
      background: none;
    }

    .tab-link[aria-current="page"] {
      color: #0C66E4;
      font-weight: 600;
      border-bottom: 2px solid #0C66E4;
      margin-bottom: -1px;
    }

    .tab-link:hover:not([aria-current="page"]) {
      color: #1D2125;
    }

    /* Empty State Section */
    .empty-state-section {
      background-color: #FFFFFF;
      border: 1px solid #DCDFE4;
      border-radius: 6px;
      padding: 32px 16px;
      text-align: center;
    }

    .empty-state-text {
      color: #626F86;
      font-size: 15px;
      margin-bottom: 24px;
    }
  </style>
</head>
<body style="width: 390px; max-width: 390px; min-width: 390px; margin: 0 auto;">
<!-- Accessible Skip Link -->
<a class="skip-link" href="#main-content">Skip to main content</a>
<!-- Phone Top Bar -->
<header>
<div class="top-bar-row">
<div class="brand-title">Planner</div>
<nav aria-label="User navigation" class="top-nav-links">
<a href="#me">Me</a>
<a href="#signout">Sign out</a>
</nav>
</div>
<div class="search-container">
<label class="search-label" for="search-input">Search or ID</label>
<input autocomplete="off" class="search-input" id="search-input" type="text"/>
</div>
</header>
<!-- Main Region -->
<main id="main-content">
<!-- Breadcrumb -->
<nav aria-label="Breadcrumb" class="breadcrumb-nav">
<ol class="breadcrumb-list">
<li class="breadcrumb-item"><a href="#top">Top</a></li>
<li class="breadcrumb-item"><a href="#project1">Project 1</a></li>
<li class="breadcrumb-item"><span aria-current="page">Iteration 4</span></li>
</ol>
</nav>
<!-- Page Title & Metrics -->
<h1 class="page-title">Iteration 4</h1>
<div class="date-range">2026-03-16 to 2026-03-27</div>
<div class="metrics-summary">
<span class="progress-val">Progress 0%</span>
<span class="metric-dot">•</span>
<span>Estimated 0.0 h</span>
<span class="metric-dot">•</span>
<span>Actual 0.0 h</span>
<span class="metric-dot">•</span>
<span>Remaining 0.0 h</span>
</div>
<!-- Page Actions Stacked Full Width -->
<div class="page-actions-stack">
<button class="btn btn-neutral" type="button">Start iteration</button>
<button class="btn btn-neutral" type="button">Edit iteration</button>
</div>
<!-- Action Links Row -->
<div class="action-links-row">
<a href="#export">Export</a>
<a href="#history">History</a>
<a href="#add-note">Add note</a>
</div>
<!-- Local Tabs in Horizontally Scrollable Row -->
<nav aria-label="Iteration sections" class="tabs-wrapper">
<div class="tabs-list" role="tablist">
<a aria-current="page" class="tab-link" href="#stories">Stories</a>
<a class="tab-link" href="#tasks">Tasks</a>
<a class="tab-link" href="#statistics">Statistics</a>
<a class="tab-link" href="#accuracy">Accuracy</a>
<a class="tab-link" href="#board">Board</a>
</div>
</nav>
<!-- Empty State -->
<div class="empty-state-section">
<p class="empty-state-text">No stories in this iteration.</p>
<button class="btn btn-primary" type="button">Create story</button>
</div>
</main>
</body>
</html>
