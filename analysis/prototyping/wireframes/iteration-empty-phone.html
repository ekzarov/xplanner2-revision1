<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Iteration 4 - No stories</title>
<style>
    /* Reset & Base Foundation Tokens */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #1D2125;
      background-color: #F7F8FA;
      line-height: 1.5;
      width: 100%;
      min-width: 0;
      -webkit-text-size-adjust: 100%;
    }

    /* Accessibility Focus Ring */
    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
    }

    /* Skip link */
    .skip-link {
      position: absolute;
      top: -9999px;
      left: 16px;
      z-index: 1000;
      padding: 8px 16px;
      background-color: #0C66E4;
      color: #FFFFFF;
      font-weight: 600;
      text-decoration: none;
      border-radius: 6px;
    }
    .skip-link:focus {
      top: 8px;
    }

    /* Header / Phone Top Bar */
    .top-bar {
      background-color: #FFFFFF;
      border-bottom: 1px solid #DCDFE4;
      padding: 12px 16px;
      width: 100%;
    }

    .top-bar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      color: #1D2125;
      text-decoration: none;
    }

    .top-bar-links {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .top-bar-links a {
      color: #0C66E4;
      text-decoration: none;
      font-size: 14px;
    }
    .top-bar-links a:hover {
      text-decoration: underline;
    }

    .search-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .search-label {
      font-size: 12px;
      font-weight: 600;
      color: #1D2125;
    }

    .search-input {
      width: 100%;
      height: 38px;
      padding: 0 12px;
      border: 1px solid #8590A2;
      border-radius: 6px;
      font-size: 14px;
      color: #1D2125;
      background-color: #FFFFFF;
      font-family: inherit;
    }

    /* Page Wrapper & Main */
    .page-wrapper {
      width: 100%;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Breadcrumb */
    .breadcrumb-nav ol {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      font-size: 13px;
      gap: 4px;
    }

    .breadcrumb-nav li {
      display: inline-flex;
      align-items: center;
    }

    .breadcrumb-nav li+li::before {
      content: "/";
      margin: 0 6px;
      color: #626F86;
    }

    .breadcrumb-nav a {
      color: #0C66E4;
      text-decoration: none;
    }
    .breadcrumb-nav a:hover {
      text-decoration: underline;
    }

    .breadcrumb-nav [aria-current="page"] {
      color: #626F86;
    }

    /* Header Info */
    .iteration-header {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .iteration-title {
      font-size: 22px;
      font-weight: 600;
      color: #1D2125;
      line-height: 1.3;
    }

    .iteration-dates {
      font-size: 13px;
      color: #626F86;
    }

    .iteration-metrics {
      font-size: 13px;
      color: #1D2125;
      line-height: 1.4;
      word-break: break-word;
    }

    .iteration-metrics span {
      display: inline;
    }

    .metric-dot {
      margin: 0 4px;
      color: #626F86;
    }

    /* Page Action Buttons */
    .actions-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .btn-neutral {
      width: 100%;
      height: 48px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      background-color: #FFFFFF;
      color: #1D2125;
      border: 1px solid #8590A2;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
    }
    .btn-neutral:hover {
      background-color: #F1F2F4;
    }

    .btn-primary {
      width: 100%;
      height: 48px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      background-color: #0C66E4;
      color: #FFFFFF;
      border: 1px solid #0C66E4;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
    }
    .btn-primary:hover {
      background-color: #0055CC;
    }

    /* Secondary inline links */
    .links-row {
      display: flex;
      gap: 16px;
      align-items: center;
      padding-top: 4px;
    }

    .links-row a {
      color: #0C66E4;
      text-decoration: none;
      font-size: 14px;
    }
    .links-row a:hover {
      text-decoration: underline;
    }

    /* Tabs Navigation */
    .tabs-nav {
      max-width: 100%;
      overflow-x: auto;
      white-space: nowrap;
      border-bottom: 1px solid #DCDFE4;
      display: flex;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      margin-top: 4px;
    }

    .tab-item {
      flex-shrink: 0;
      padding: 10px 14px;
      color: #626F86;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      display: inline-block;
    }
    .tab-item:hover {
      color: #1D2125;
    }

    .tab-item[aria-current="page"] {
      color: #0C66E4;
      font-weight: 600;
      border-bottom-color: #0C66E4;
    }

    /* Empty state */
    .empty-state-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-top: 8px;
      width: 100%;
    }

    .empty-state-text {
      color: #626F86;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
<style>

}
