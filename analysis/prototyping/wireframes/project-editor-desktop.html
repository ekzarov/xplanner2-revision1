<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UX13-33 Edit project: Project 1</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #1D2125;
      background-color: #F7F8FA;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Accessibility Skip Link */
    .skip-link {
      position: absolute;
      top: -100px;
      left: 16px;
      background: #0C66E4;
      color: #FFFFFF;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 6px;
      z-index: 9999;
      text-decoration: none;
      transition: top 0.1s ease-in-out;
    }
    .skip-link:focus {
      top: 10px;
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
    }

    /* Focus outline for all interactive elements */
    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
    }

    /* Top Bar */
    header.top-bar {
      height: 56px;
      background-color: #FFFFFF;
      border-bottom: 1px solid #DCDFE4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: relative;
    }

    .brand-search-group {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      color: #1D2125;
      letter-spacing: -0.2px;
      text-decoration: none;
    }

    .search-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-group label {
      font-size: 14px;
      color: #1D2125;
      white-space: nowrap;
    }

    .search-input {
      width: 200px;
      height: 36px;
      padding: 0 12px;
      border: 1px solid #8590A2;
      border-radius: 6px;
      background-color: #FFFFFF;
      color: #1D2125;
      font-family: inherit;
      font-size: 14px;
    }

    .top-links {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .top-links a {
      color: #0C66E4;
      text-decoration: none;
      font-size: 14px;
    }
    .top-links a:hover {
      text-decoration: underline;
    }

    /* Main Container */
    main {
      padding: 20px 24px 48px;
      max-width: 1200px;
      width: 100%;
      margin: 0;
    }

    /* Breadcrumb */
    nav.breadcrumb {
      margin-bottom: 16px;
    }

    nav.breadcrumb ol {
      list-style: none;
      display: flex;
      align-items: center;
      font-size: 14px;
    }

    nav.breadcrumb li + li::before {
      content: "/";
      margin: 0 8px;
      color: #626F86;
    }

    nav.breadcrumb a {
      color: #0C66E4;
      text-decoration: none;
    }
    nav.breadcrumb a:hover {
      text-decoration: underline;
    }

    nav.breadcrumb [aria-current="page"] {
      color: #1D2125;
      font-weight: 400;
    }

    /* Page Heading */
    h1.page-title {
      font-size: 24px;
      font-weight: 700;
      color: #1D2125;
      margin-bottom: 24px;
      line-height: 1.25;
    }

    /* Form Section Card */
    .form-card {
      background-color: #FFFFFF;
      border: 1px solid #DCDFE4;
      border-radius: 6px;
      padding: 24px;
      width: 100%;
      max-width: 640px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 16px;
      font-weight: 500;
      color: #1D2125;
      margin-bottom: 8px;
    }

    .text-input {
      width: 100%;
      height: 36px;
      padding: 0 12px;
      border: 1px solid #8590A2;
      border-radius: 6px;
      background-color: #FFFFFF;
      color: #1D2125;
      font-family: inherit;
      font-size: 14px;
    }

    .text-area {
      width: 100%;
      height: 130px;
      padding: 8px 12px;
      border: 1px solid #8590A2;
      border-radius: 6px;
      background-color: #FFFFFF;
      color: #1D2125;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
      line-height: 1.4;
    }

    .help-link-wrapper {
      margin-top: 6px;
    }

    .formatting-help {
      color: #0C66E4;
      text-decoration: none;
      font-size: 13px;
    }
    .formatting-help:hover {
      text-decoration: underline;
    }

    /* Checkbox Group */
    .checkbox-group {
      margin-top: 20px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 14px;
      color: #1D2125;
      user-select: none;
    }

    .checkbox-input {
      width: 16px;
      height: 16px;
      accent-color: #0C66E4;
      border: 1px solid #8590A2;
      border-radius: 3px;
      cursor: pointer;
    }

    /* Action Buttons */
    .button-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .btn {
      height: 36px;
      padding: 0 16px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .btn-primary {
      background-color: #0C66E4;
      color: #FFFFFF;
      border: 1px solid #0C66E4;
    }
    .btn-primary:hover {
      background-color: #0055CC;
      border-color: #0055CC;
    }

    .btn-neutral {
      background-color: #FFFFFF;
      color: #1D2125;
      border: 1px solid #8590A2;
    }
    .btn-neutral:hover {
      background-color: #F7F8FA;
    }
  </style>
</head>
<body>
  <!-- Accessibility Skip Link -->
  <a href="#main" class="skip-link">Skip to main content</a>

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="brand-search-group">
      <span class="brand">Planner</span>
      <form class="search-group" role="search" onsubmit="return false;">
        <label for="search-input">Search or ID</label>
        <input type="text" id="search-input" class="search-input">
      </form>
    </div>
    <div class="top-links">
      <a href="#">Me</a>
      <a href="#">Sign out</a>
    </div>
  </header>

  <!-- Main Content Region -->
  <main id="main">
    <!-- Breadcrumb Navigation -->
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <ol>
        <li><a href="#">Top</a></li>
        <li><a href="#">Project 1</a></li>
        <li aria-current="page">Edit</li>
      </ol>
    </nav>

    <!-- Page Title -->
    <h1 class="page-title">Edit project: Project 1</h1>

    <!-- Form Container -->
    <section class="form-card" aria-labelledby="form-heading">
      <h2 id="form-heading" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;">Edit project details</h2>
      <form id="edit-project-form" onsubmit="return false;">
        <!-- Name -->
        <div class="form-group">
          <label for="project-name" class="form-label">Name (required)</label>
          <input type="text" id="project-name" name="name" class="text-input" value="Project 1" required>
        </div>

        <!-- Description -->
        <div class="form-group">
          <label for="project-desc" class="form-label">Description</label>
          <textarea id="project-desc" name="description" class="text-area">Synthetic sample project for the planning prototype.</textarea>
          <div class="help-link-wrapper">
            <a href="#" class="formatting-help">Formatting help</a>
          </div>
        </div>

        <!-- Wiki URL -->
        <div class="form-group">
          <label for="project-wiki" class="form-label">Wiki URL</label>
          <input type="text" id="project-wiki" name="wiki_url" class="text-input" value="">
        </div>

        <!-- Checkboxes -->
        <div class="checkbox-group">
          <label class="checkbox-label" for="escape-brackets">
            <input type="checkbox" id="escape-brackets" name="escape_brackets" class="checkbox-input">
            Escape brackets in descriptions
          </label>

          <label class="checkbox-label" for="missing-time">
            <input type="checkbox" id="missing-time" name="missing_time_notification" class="checkbox-input">
            Send missing time entry notification
          </label>

          <label class="checkbox-label" for="hidden-project">
            <input type="checkbox" id="hidden-project" name="hidden" class="checkbox-input">
            Hidden
          </label>
        </div>

        <!-- Form Buttons -->
        <div class="button-group">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="reset" class="btn btn-neutral">Reset</button>
          <button type="button" class="btn btn-neutral">Cancel</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
