<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UX13-31 People - Planner (Admin)</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #F7F8FA;
      color: #1D2125;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* Skip link */
    .skip-link {
      position: absolute;
      top: -9999px;
      left: 16px;
      background: #0C66E4;
      color: #FFFFFF;
      padding: 8px 16px;
      text-decoration: none;
      font-weight: 600;
      border-radius: 6px;
      z-index: 1000;
      outline: none;
    }

    .skip-link:focus {
      top: 10px;
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
    }

    /* Focus styling */
    a:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
    }

    /* Top bar */
    .top-bar {
      height: 56px;
      background-color: #FFFFFF;
      border-bottom: 1px solid #DCDFE4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      color: #1D2125;
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .search-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-group label {
      font-size: 13px;
      color: #1D2125;
      white-space: nowrap;
    }

    .search-input {
      height: 32px;
      width: 220px;
      padding: 0 10px;
      font-family: inherit;
      font-size: 14px;
      color: #1D2125;
      background-color: #FFFFFF;
      border: 1px solid #8590A2;
      border-radius: 6px;
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-link {
      color: #0C66E4;
      text-decoration: none;
      font-size: 14px;
    }

    .nav-link:hover {
      text-decoration: underline;
    }

    /* Main container */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px 24px 48px 24px;
    }

    /* Breadcrumb */
    .breadcrumb-nav {
      margin-bottom: 20px;
    }

    .breadcrumb-list {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }

    .breadcrumb-item a {
      color: #0C66E4;
      text-decoration: none;
    }

    .breadcrumb-item a:hover {
      text-decoration: underline;
    }

    .breadcrumb-separator {
      color: #626F86;
    }

    .breadcrumb-item.current {
      color: #1D2125;
    }

    /* Header section */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 700;
      color: #1D2125;
      letter-spacing: -0.01em;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 16px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid transparent;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .btn-primary {
      background-color: #0C66E4;
      color: #FFFFFF;
      border-color: #0C66E4;
    }

    .btn-primary:hover {
      background-color: #0055CC;
      border-color: #0055CC;
    }

    .btn-neutral {
      background-color: #FFFFFF;
      color: #1D2125;
      border-color: #8590A2;
    }

    .btn-neutral:disabled {
      background-color: #FFFFFF;
      color: #A5ADBA;
      border-color: #DCDFE4;
      cursor: not-allowed;
    }

    /* Table styling */
    .table-container {
      background: #FFFFFF;
      border: 1px solid #DCDFE4;
      border-radius: 6px;
      overflow: hidden;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    .data-table th {
      background-color: #F1F2F4;
      color: #1D2125;
      font-weight: 600;
      padding: 0 16px;
      height: 40px;
      border-bottom: 1px solid #DCDFE4;
      user-select: none;
    }

    .data-table th button {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #1D2125;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 0;
    }

    .sort-indicator {
      font-size: 11px;
      line-height: 1;
    }

    .data-table td {
      height: 40px;
      padding: 0 16px;
      border-bottom: 1px solid #DCDFE4;
      color: #1D2125;
    }

    .data-table tr:last-child td {
      border-bottom: none;
    }

    .data-table tr:hover td {
      background-color: #FAFBFC;
    }

    .table-link {
      color: #0C66E4;
      text-decoration: none;
    }

    .table-link:hover {
      text-decoration: underline;
    }

    /* Paging */
    .pagination-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      color: #626F86;
      font-size: 14px;
    }

    .pagination-actions {
      display: flex;
      gap: 8px;
    }
  </style>
</head>
<body>
  <!-- Skip to main content -->
  <a href="#main" class="skip-link">Skip to main content</a>

  <!-- Top bar -->
  <header class="top-bar" role="banner">
    <div class="top-bar-left">
      <span class="brand">Planner</span>
      <div class="search-group">
        <label for="search-input">Search or ID</label>
        <input type="text" id="search-input" class="search-input">
      </div>
    </div>
    <div class="top-bar-right">
      <a href="#" class="nav-link">Me</a>
      <a href="#" class="nav-link">Sign out</a>
    </div>
  </header>

  <!-- Main content area -->
  <main id="main">
    <!-- Breadcrumb -->
    <nav class="breadcrumb-nav" aria-label="Breadcrumb">
      <ol class="breadcrumb-list">
        <li class="breadcrumb-item"><a href="#">Top</a></li>
        <li class="breadcrumb-separator" aria-hidden="true">/</li>
        <li class="breadcrumb-item current" aria-current="page">People</li>
      </ol>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
      <h1 class="page-title">People</h1>
      <button type="button" class="btn btn-primary">Create person</button>
    </div>

    <!-- Table of People -->
    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th scope="col" aria-sort="none">
              <button type="button">User ID</button>
            </th>
            <th scope="col" aria-sort="ascending">
              <button type="button">Name <span class="sort-indicator" aria-hidden="true">&#9650;</span></button>
            </th>
            <th scope="col" aria-sort="none">
              <button type="button">Initials</button>
            </th>
            <th scope="col" aria-sort="none">
              <button type="button">Phone</button>
            </th>
            <th scope="col" aria-sort="none">
              <button type="button">E-mail</button>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>usera</td>
            <td><a href="#" class="table-link">User A</a></td>
            <td>UA</td>
            <td>000-0001</td>
            <td><a href="mailto:usera@example.test" class="table-link">usera@example.test</a></td>
          </tr>
          <tr>
            <td>userb</td>
            <td><a href="#" class="table-link">User B</a></td>
            <td>UB</td>
            <td>000-0002</td>
            <td><a href="mailto:userb@example.test" class="table-link">userb@example.test</a></td>
          </tr>
          <tr>
            <td>userc</td>
            <td><a href="#" class="table-link">User C</a></td>
            <td>UC</td>
            <td>000-0003</td>
            <td><a href="mailto:userc@example.test" class="table-link">userc@example.test</a></td>
          </tr>
          <tr>
            <td>userd</td>
            <td><a href="#" class="table-link">User D</a></td>
            <td>UD</td>
            <td>000-0004</td>
            <td><a href="mailto:userd@example.test" class="table-link">userd@example.test</a></td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="pagination-bar">
      <span>Page 1 of 1</span>
      <div class="pagination-actions">
        <button type="button" class="btn btn-neutral" disabled>Previous</button>
        <button type="button" class="btn btn-neutral" disabled>Next</button>
      </div>
    </div>
  </main>
</body>
</html>
