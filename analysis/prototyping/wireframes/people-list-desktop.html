<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>People - Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #F7F8FA;
      color: #1D2125;
      font-size: 16px;
      line-height: 1.5;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    a, button, input {
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
    }

    .btn-primary {
      background-color: #0C66E4;
      color: #FFFFFF;
      height: 36px;
      padding: 0 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      cursor: pointer;
    }
    .btn-primary:hover {
      background-color: #0055CC;
    }

    .btn-neutral-disabled {
      background-color: #FFFFFF;
      color: #8590A2;
      border: 1px solid #DCDFE4;
      height: 36px;
      padding: 0 14px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 400;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .input-control {
      height: 36px;
      border: 1px solid #8590A2;
      border-radius: 6px;
      background-color: #FFFFFF;
      padding: 0 10px;
      font-size: 16px;
      color: #1D2125;
      box-sizing: border-box;
    }

    .table-container {
      width: 100%;
      background-color: #FFFFFF;
      border: 1px solid #DCDFE4;
      border-radius: 6px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      text-align: left;
    }

    th {
      background-color: #F1F2F4;
      color: #1D2125;
      font-weight: 600;
      height: 40px;
      padding: 0 16px;
      border-bottom: 1px solid #DCDFE4;
      user-select: none;
    }

    td {
      height: 40px;
      padding: 0 16px;
      border-bottom: 1px solid #DCDFE4;
      color: #1D2125;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background-color: #F7F8FA;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- Top bar (white, 56px, divider below) -->
  <header class="w-full bg-[#FFFFFF] border-b border-[#DCDFE4] h-[56px] px-8 flex items-center justify-between">
    <div class="flex items-center space-x-6">
      <span class="text-[20px] font-bold tracking-tight text-[#1D2125]">Planner</span>
      <div class="flex items-center space-x-2">
        <label for="search-input" class="text-[14px] text-[#1D2125] whitespace-nowrap">Search or ID</label>
        <input 
          id="search-input" 
          type="text" 
          class="input-control w-64"
        />
      </div>
    </div>
    <div class="flex items-center space-x-5 text-[14px]">
      <a href="#" class="text-[#0C66E4] hover:text-[#0055CC] font-normal">Me</a>
      <a href="#" class="text-[#0C66E4] hover:text-[#0055CC] font-normal">Sign out</a>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 w-full max-w-[1400px] mx-auto px-8 pt-6 pb-12">
    <!-- Breadcrumb (14px, links in primary, current item plain text): Top / People -->
    <nav class="text-[14px] text-[#626F86] mb-5" aria-label="Breadcrumb">
      <a href="#" class="text-[#0C66E4] hover:text-[#0055CC]">Top</a>
      <span class="mx-2 text-[#8590A2]">/</span>
      <span class="text-[#1D2125]">People</span>
    </nav>

    <!-- Page heading & Create person button -->
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-[24px] font-semibold text-[#1D2125] m-0 leading-tight">People</h1>
      <button type="button" class="btn-primary">
        Create person
      </button>
    </div>

    <!-- Table (full width, header #F1F2F4, 14px, 40px rows, sortable headers, sorted by Name ascending with an arrow) -->
    <div class="table-container mb-4">
      <table>
        <thead>
          <tr>
            <th class="w-[18%]">
              <button type="button" class="flex items-center space-x-1 font-semibold text-[#1D2125] hover:text-[#0C66E4] cursor-pointer bg-transparent border-0 p-0 text-[14px]">
                <span>User ID</span>
              </button>
            </th>
            <th class="w-[24%]">
              <button type="button" class="flex items-center space-x-1.5 font-semibold text-[#1D2125] hover:text-[#0C66E4] cursor-pointer bg-transparent border-0 p-0 text-[14px]">
                <span>Name</span>
                <span class="text-[12px] text-[#1D2125]" aria-label="sorted ascending">▲</span>
              </button>
            </th>
            <th class="w-[14%]">
              <button type="button" class="flex items-center space-x-1 font-semibold text-[#1D2125] hover:text-[#0C66E4] cursor-pointer bg-transparent border-0 p-0 text-[14px]">
                <span>Initials</span>
              </button>
            </th>
            <th class="w-[18%]">
              <button type="button" class="flex items-center space-x-1 font-semibold text-[#1D2125] hover:text-[#0C66E4] cursor-pointer bg-transparent border-0 p-0 text-[14px]">
                <span>Phone</span>
              </button>
            </th>
            <th class="w-[26%]">
              <button type="button" class="flex items-center space-x-1 font-semibold text-[#1D2125] hover:text-[#0C66E4] cursor-pointer bg-transparent border-0 p-0 text-[14px]">
                <span>E-mail</span>
              </button>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="font-mono text-[13px] text-[#1D2125]">usera</td>
            <td>
              <a href="#" class="text-[#0C66E4] hover:text-[#0055CC] font-medium">User A</a>
            </td>
            <td>UA</td>
            <td>000-0001</td>
            <td>
              <a href="mailto:usera@example.test" class="text-[#0C66E4] hover:text-[#0055CC]">usera@example.test</a>
            </td>
          </tr>
          <tr>
            <td class="font-mono text-[13px] text-[#1D2125]">userb</td>
            <td>
              <a href="#" class="text-[#0C66E4] hover:text-[#0055CC] font-medium">User B</a>
            </td>
            <td>UB</td>
            <td>000-0002</td>
            <td>
              <a href="mailto:userb@example.test" class="text-[#0C66E4] hover:text-[#0055CC]">userb@example.test</a>
            </td>
          </tr>
          <tr>
            <td class="font-mono text-[13px] text-[#1D2125]">userc</td>
            <td>
              <a href="#" class="text-[#0C66E4] hover:text-[#0055CC] font-medium">User C</a>
            </td>
            <td>UC</td>
            <td>000-0003</td>
            <td>
              <a href="mailto:userc@example.test" class="text-[#0C66E4] hover:text-[#0055CC]">userc@example.test</a>
            </td>
          </tr>
          <tr>
            <td class="font-mono text-[13px] text-[#1D2125]">userd</td>
            <td>
              <a href="#" class="text-[#0C66E4] hover:text-[#0055CC] font-medium">User D</a>
            </td>
            <td>UD</td>
            <td>000-0004</td>
            <td>
              <a href="mailto:userd@example.test" class="text-[#0C66E4] hover:text-[#0055CC]">userd@example.test</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Paging controls below table -->
    <div class="flex items-center justify-between pt-2">
      <div class="text-[14px] text-[#626F86]">
        Page 1 of 1
      </div>
      <div class="flex items-center space-x-2">
        <button type="button" disabled class="btn-neutral-disabled">
          Previous
        </button>
        <button type="button" disabled class="btn-neutral-disabled">
          Next
        </button>
      </div>
    </div>
  </main>
</body>
</html>
