<script>
  (function() {
    const insertBtn = document.getElementById('btn-insert-time');
    const startInput = document.getElementById('start-new-row');
    if (insertBtn && startInput) {
      insertBtn.addEventListener('click', function() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        startInput.value = hours + ':' + minutes;
        startInput.focus();
      });
    }

    const cancelBtn = document.getElementById('btn-cancel');
    if (cancelBtn) {
      cancelBtn.addEventListener('click', function() {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = '#';
        }
      });
    }

    const form = document.getElementById('time-task-form');
    if (form) {
      form.addEventListener('submit', function(e) {
        e.preventDefault();
      });
    }
  })();
