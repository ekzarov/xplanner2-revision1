<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time: Task 8 - Planner</title>
  <style>
    /* Reset & Base Foundation Styles */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #F7F8FA;
      color: #1D2125;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Accessibility: Skip to main content link */
    .skip-link {
      position: absolute;
      top: -9999px;
      left: 16px;
      background: #FFFFFF;
      color: #0C66E4;
      padding: 8px 16px;
      border: 2px solid #0C66E4;
      border-radius: 6px;
      font-weight: 600;
      z-index: 10000;
      text-decoration: none;
    }
    .skip-link:focus {
      top: 10px;
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
    }

    /* Focus styling */
    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
    }

    /* Top Navigation Bar */
    .top-bar {
      height: 56px;
      background-color: #FFFFFF;
      border-bottom: 1px solid #DCDFE4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .brand {
      font-size: 18px;
      font-weight: 700;
      color: #1D2125;
      text-decoration: none;
      letter-spacing: -0.01em;
    }
    .search-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-label {
      font-size: 14px;
      color: #1D2125;
      font-weight: 500;
    }
    .search-input {
      height: 36px;
      width: 240px;
      padding: 0 12px;
      background-color: #FFFFFF;
      border: 1px solid #8590A2;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      color: #1D2125;
    }
    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .nav-link {
      color: #0C66E4;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .nav-link:hover {
      text-decoration: underline;
    }

    /* Main Container */
    main {
      padding: 24px 32px 48px;
      max-width: 1360px;
      margin: 0 auto;
    }

    /* Breadcrumb */
    .breadcrumb-nav {
      margin-bottom: 16px;
    }
    .breadcrumb-list {
      display: flex;
      align-items: center;
      list-style: none;
      font-size: 14px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .breadcrumb-item {
      display: flex;
      align-items: center;
    }
    .breadcrumb-item:not(:last-child)::after {
      content: "/";
      margin-left: 6px;
      color: #626F86;
    }
    .breadcrumb-item a {
      color: #0C66E4;
      text-decoration: none;
    }
    .breadcrumb-item a:hover {
      text-decoration: underline;
    }
    .breadcrumb-item [aria-current="page"] {
      color: #1D2125;
      font-weight: 400;
    }

    /* Page Heading */
    .page-title {
      font-size: 24px;
      font-weight: 700;
      color: #1D2125;
      margin-bottom: 24px;
      line-height: 1.25;
    }

    /* Form Container / White section */
    .form-section {
      background-color: #FFFFFF;
      border: 1px solid #DCDFE4;
      border-radius: 6px;
      overflow-x: auto;
      margin-bottom: 24px;
    }

    /* Time Grid Table */
    .time-grid-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
      min-width: 1000px;
    }
    .time-grid-table th {
      background-color: #F1F2F4;
      color: #1D2125;
      font-weight: 600;
      font-size: 14px;
      height: 40px;
      padding: 0 12px;
      border-bottom: 1px solid #DCDFE4;
      white-space: nowrap;
    }
    .time-grid-table td {
      padding: 8px 12px;
      border-bottom: 1px solid #DCDFE4;
      vertical-align: middle;
      background-color: #FFFFFF;
    }
    .time-grid-table tr:last-child td {
      border-bottom: none;
    }

    /* Specific Table Columns */
    .col-delete {
      width: 60px;
      text-align: center;
    }
    .time-grid-table th.col-delete {
      text-align: center;
    }
    .col-date {
      width: 130px;
    }
    .col-time {
      width: 90px;
    }
    .col-time-insert {
      width: 180px;
    }
    .col-duration {
      width: 75px;
    }
    .col-person {
      width: 140px;
    }
    .col-pair {
      width: 130px;
    }
    .col-desc {
      min-width: 200px;
    }

    /* Inputs & Selects inside table */
    .grid-input {
      height: 36px;
      width: 100%;
      background-color: #FFFFFF;
      border: 1px solid #8590A2;
      border-radius: 6px;
      padding: 0 10px;
      font-family: inherit;
      font-size: 14px;
      color: #1D2125;
      font-variant-numeric: normal;
    }
    .grid-select {
      height: 36px;
      width: 100%;
      background-color: #FFFFFF;
      border: 1px solid #8590A2;
      border-radius: 6px;
      padding: 0 8px;
      font-family: inherit;
      font-size: 14px;
      color: #1D2125;
      cursor: pointer;
    }

    /* Native Checkbox styling */
    .native-checkbox {
      width: 16px;
      height: 16px;
      accent-color: #0C66E4;
      cursor: pointer;
      vertical-align: middle;
    }

    /* Insert time group */
    .insert-time-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .insert-time-group .grid-input {
      width: 70px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 16px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      border: 1px solid transparent;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .btn-primary {
      background-color: #0C66E4;
      color: #FFFFFF;
      border-color: #0C66E4;
    }
    .btn-primary:hover {
      background-color: #0055CC;
      border-color: #0055CC;
    }
    .btn-neutral {
      background-color: #FFFFFF;
      color: #1D2125;
      border-color: #8590A2;
    }
    .btn-neutral:hover {
      background-color: #F7F8FA;
    }

    /* Remaining hours section */
    .remaining-hours-container {
      margin-bottom: 24px;
    }
    .remaining-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #1D2125;
      margin-bottom: 6px;
    }
    .remaining-input-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .remaining-input {
      height: 36px;
      width: 72px;
      padding: 0 10px;
      background-color: #FFFFFF;
      border: 1px solid #8590A2;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      color: #1D2125;
      font-variant-numeric: normal;
    }
    .remaining-hint {
      font-size: 14px;
      color: #626F86;
    }

    /* Action Buttons Row */
    .actions-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
  </style>
</head>
<body>

  <!-- Accessible Skip Link (First element in body) -->
  <a href="#main" class="skip-link">Skip to main content</a>

  <!-- Top Navigation Bar -->
  <header class="top-bar">
    <div class="top-bar-left">
      <a href="#" class="brand">Planner</a>
      <div class="search-wrapper">
        <label for="search-input" class="search-label">Search or ID</label>
        <input type="text" id="search-input" class="search-input">
      </div>
    </div>
    <div class="top-bar-right">
      <a href="#" class="nav-link">Me</a>
      <a href="#" class="nav-link">Sign out</a>
    </div>
  </header>

  <!-- Main Region -->
  <main id="main">

    <!-- Breadcrumb -->
    <nav class="breadcrumb-nav" aria-label="Breadcrumb">
      <ol class="breadcrumb-list">
        <li class="breadcrumb-item"><a href="#">Top</a></li>
        <li class="breadcrumb-item"><a href="#">Project 1</a></li>
        <li class="breadcrumb-item"><a href="#">Iteration 3</a></li>
        <li class="breadcrumb-item"><a href="#">Story 2</a></li>
        <li class="breadcrumb-item"><a href="#">Task 8</a></li>
        <li class="breadcrumb-item"><span aria-current="page">Time</span></li>
      </ol>
    </nav>

    <!-- Page Heading -->
    <h1 class="page-title">Time: Task 8</h1>

    <!-- Form Section / Grid Table -->
    <section class="form-section" aria-label="Time entries table">
      <table class="time-grid-table">
        <thead>
          <tr>
            <th scope="col" class="col-delete">Delete</th>
            <th scope="col" class="col-date">Report date</th>
            <th scope="col" class="col-time">Start</th>
            <th scope="col" class="col-time">End</th>
            <th scope="col" class="col-duration">Duration</th>
            <th scope="col" class="col-person">Person (required)</th>
            <th scope="col" class="col-pair">Pair</th>
            <th scope="col" class="col-desc">Description</th>
          </tr>
        </thead>
        <tbody>
          <!-- Row 1 -->
          <tr>
            <td class="col-delete">
              <input type="checkbox" id="del-1" class="native-checkbox" aria-label="Delete entry">
            </td>
            <td class="col-date">
              <input type="text" class="grid-input" value="2026-03-03" aria-label="Report date row 1">
            </td>
            <td class="col-time">
              <input type="text" class="grid-input" value="09:00" aria-label="Start time row 1">
            </td>
            <td class="col-time">
              <input type="text" class="grid-input" value="10:00" aria-label="End time row 1">
            </td>
            <td class="col-duration">
              <input type="text" class="grid-input" value="1.0" aria-label="Duration row 1">
            </td>
            <td class="col-person">
              <select class="grid-select" aria-label="Person (required), row 1">
                <option selected>User B</option>
                <option>User A</option>
                <option>User C</option>
                <option>User D</option>
              </select>
            </td>
            <td class="col-pair">
              <select class="grid-select" aria-label="Pair row 1">
                <option selected>(none)</option>
                <option>User A</option>
                <option>User B</option>
                <option>User C</option>
                <option>User D</option>
              </select>
            </td>
            <td class="col-desc">
              <input type="text" class="grid-input" value="Synthetic entry" aria-label="Description row 1">
            </td>
          </tr>

          <!-- Row 2 -->
          <tr>
            <td class="col-delete">
              <input type="checkbox" id="del-2" class="native-checkbox" aria-label="Delete entry">
            </td>
            <td class="col-date">
              <input type="text" class="grid-input" value="2026-03-04" aria-label="Report date row 2">
            </td>
            <td class="col-time">
              <input type="text" class="grid-input" value="09:00" aria-label="Start time row 2">
            </td>
            <td class="col-time">
              <input type="text" class="grid-input" value="10:00" aria-label="End time row 2">
            </td>
            <td class="col-duration">
              <input type="text" class="grid-input" value="1.0" aria-label="Duration row 2">
            </td>
            <td class="col-person">
              <select class="grid-select" aria-label="Person (required), row 2">
                <option selected>User B</option>
                <option>User A</option>
                <option>User C</option>
                <option>User D</option>
              </select>
            </td>
            <td class="col-pair">
              <select class="grid-select" aria-label="Pair row 2">
                <option selected>(none)</option>
                <option>User A</option>
                <option>User B</option>
                <option>User C</option>
                <option>User D</option>
              </select>
            </td>
            <td class="col-desc">
              <input type="text" class="grid-input" value="Synthetic entry" aria-label="Description row 2">
            </td>
          </tr>

          <!-- Row 3 (Empty new row with Insert time) -->
          <tr>
            <td class="col-delete">
              <input type="checkbox" id="del-3" class="native-checkbox" aria-label="Delete entry">
            </td>
            <td class="col-date">
              <input type="text" class="grid-input" aria-label="New entry report date">
            </td>
            <td class="col-time-insert">
              <div class="insert-time-group">
                <input type="text" class="grid-input" aria-label="New entry start time">
                <button type="button" class="btn btn-neutral">Insert time</button>
              </div>
            </td>
            <td class="col-time">
              <input type="text" class="grid-input" aria-label="New entry end time">
            </td>
            <td class="col-duration">
              <input type="text" class="grid-input" value="0.0" aria-label="New entry duration">
            </td>
            <td class="col-person">
              <select class="grid-select" aria-label="New entry person (required)">
                <option selected>User B</option>
                <option>User A</option>
                <option>User C</option>
                <option>User D</option>
              </select>
            </td>
            <td class="col-pair">
              <select class="grid-select" aria-label="New entry pair">
                <option selected>(none)</option>
                <option>User A</option>
                <option>User B</option>
                <option>User C</option>
                <option>User D</option>
              </select>
            </td>
            <td class="col-desc">
              <input type="text" class="grid-input" aria-label="New entry description">
            </td>
          </tr>
        </tbody>
      </table>
    </section>

    <!-- Remaining Hours -->
    <div class="remaining-hours-container">
      <label for="remaining-hours-input" class="remaining-label">Remaining hours</label>
      <div class="remaining-input-group">
        <input type="text" id="remaining-hours-input" class="remaining-input" value="6.0">
        <span class="remaining-hint">Updates the task estimate on save</span>
      </div>
    </div>

    <!-- Actions Row -->
    <div class="actions-row">
      <button type="button" class="btn btn-primary">Save</button>
      <button type="button" class="btn btn-neutral">Reset</button>
      <button type="button" class="btn btn-neutral">Cancel</button>
    </div>

  </main>

</body>
</html>
