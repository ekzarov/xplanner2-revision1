<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit iteration: Iteration 3 - Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --font-stack: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --text: #1D2125;
      --secondary: #626F86;
      --primary: #0C66E4;
      --primary-hover: #0055CC;
      --bg: #F7F8FA;
      --surface: #FFFFFF;
      --control-border: #8590A2;
      --divider: #DCDFE4;
      --selected: #E9F2FF;
      --focus-ring: 2px solid #0C66E4;
    }

    body {
      font-family: var(--font-stack);
      color: var(--text);
      background-color: var(--bg);
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--primary);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }

    .focus-ring:focus, .focus-ring:focus-visible {
      outline: var(--focus-ring);
      outline-offset: 2px;
    }

    /* Force focus state style on End date input as specified */
    .has-keyboard-focus {
      outline: var(--focus-ring) !important;
      outline-offset: 2px !important;
    }

    /* Form container: single column about 640px wide on a white section, flat, no shadows */
    .form-card {
      background-color: var(--surface);
      border: 1px solid var(--divider);
      border-radius: 6px;
      width: 100%;
      max-width: 640px;
    }

    /* Calendar popup: the ONLY shadow on the screen */
    .date-picker-popup {
      background: var(--surface);
      border: 1px solid var(--divider);
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(9, 30, 66, 0.15), 0 0 1px rgba(9, 30, 66, 0.31);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top bar (white, 56px, divider below): "Planner" on the left, search field with visible label "Search or ID", "Me" and "Sign out" on the right -->
  <header class="w-full bg-[#FFFFFF] border-b border-[#DCDFE4] h-14 px-6 flex items-center justify-between shrink-0">
    <div class="flex items-center space-x-6">
      <span class="text-xl font-bold text-[#1D2125] tracking-tight">Planner</span>
      <div class="flex items-center space-x-2">
        <label for="search-input" class="text-sm font-normal text-[#1D2125]">Search or ID</label>
        <input 
          id="search-input" 
          type="text" 
          class="h-9 px-3 w-48 text-sm bg-white border border-[#8590A2] rounded-[6px] text-[#1D2125] focus-ring"
        />
      </div>
    </div>
    <div class="flex items-center space-x-4 text-sm font-normal">
      <a href="#" class="text-[#0C66E4] hover:underline focus-ring rounded-[2px]">Me</a>
      <span class="text-[#DCDFE4]">|</span>
      <a href="#" class="text-[#0C66E4] hover:underline focus-ring rounded-[2px]">Sign out</a>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 w-full px-6 py-4">
    <!-- Breadcrumb (14px, links in primary, current item plain text): Top / Project 1 / Iteration 3 / Edit -->
    <nav class="text-sm mb-4 text-[#1D2125] flex items-center space-x-1.5" aria-label="Breadcrumb">
      <a href="#" class="text-[#0C66E4] hover:underline focus-ring rounded-[2px]">Top</a>
      <span class="text-[#626F86]">/</span>
      <a href="#" class="text-[#0C66E4] hover:underline focus-ring rounded-[2px]">Project 1</a>
      <span class="text-[#626F86]">/</span>
      <a href="#" class="text-[#0C66E4] hover:underline focus-ring rounded-[2px]">Iteration 3</a>
      <span class="text-[#626F86]">/</span>
      <span class="text-[#1D2125]">Edit</span>
    </nav>

    <!-- Page heading 24px weight 600 -->
    <h1 class="text-2xl font-semibold text-[#1D2125] mb-5">Edit iteration: Iteration 3</h1>

    <!-- Single-column form about 640px wide on a white section over the #F7F8FA page -->
    <div class="form-card p-6">
      <form action="#" method="post" onsubmit="return false;" class="space-y-4">
        
        <!-- Name (required) -->
        <div>
          <label for="iteration-name" class="block text-base font-normal text-[#1D2125] mb-1.5">
            Name (required)
          </label>
          <input 
            type="text" 
            id="iteration-name" 
            name="name" 
            value="Iteration 3" 
            required 
            class="w-full h-9 px-3 text-base bg-white border border-[#8590A2] rounded-[6px] text-[#1D2125] focus-ring"
          />
        </div>

        <!-- Start date -->
        <div>
          <label for="start-date" class="block text-base font-normal text-[#1D2125] mb-1.5">
            Start date
          </label>
          <div class="relative flex items-center">
            <input 
              type="text" 
              id="start-date" 
              name="start_date" 
              value="2026-03-02" 
              class="w-full h-9 pl-3 pr-10 text-base bg-white border border-[#8590A2] rounded-[6px] text-[#1D2125] focus-ring"
            />
            <button 
              type="button" 
              aria-label="Choose start date" 
              class="absolute right-1 w-8 h-8 flex items-center justify-center text-[#626F86] hover:text-[#1D2125] rounded-[4px] focus-ring"
            >
              <!-- Calendar Icon -->
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2" stroke-width="2"/>
                <line x1="16" y1="2" x2="16" y2="6" stroke-width="2"/>
                <line x1="8" y1="2" x2="8" y2="6" stroke-width="2"/>
                <line x1="3" y1="10" x2="21" y2="10" stroke-width="2"/>
              </svg>
            </button>
          </div>
          <p class="text-xs text-[#626F86] mt-1">Format: 2026-03-02</p>
        </div>

        <!-- End date (With Open Date Picker Popup below) -->
        <div class="relative">
          <label for="end-date" class="block text-base font-normal text-[#1D2125] mb-1.5">
            End date
          </label>
          <div class="relative flex items-center">
            <input 
              type="text" 
              id="end-date" 
              name="end_date" 
              value="2026-03-13" 
              class="w-full h-9 pl-3 pr-10 text-base bg-white border border-[#8590A2] rounded-[6px] text-[#1D2125] has-keyboard-focus"
            />
            <button 
              type="button" 
              aria-label="Choose end date" 
              class="absolute right-1 w-8 h-8 flex items-center justify-center text-[#626F86] hover:text-[#1D2125] rounded-[4px] focus-ring"
            >
              <!-- Calendar Icon -->
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2" stroke-width="2"/>
                <line x1="16" y1="2" x2="16" y2="6" stroke-width="2"/>
                <line x1="8" y1="2" x2="8" y2="6" stroke-width="2"/>
                <line x1="3" y1="10" x2="21" y2="10" stroke-width="2"/>
              </svg>
            </button>
          </div>
          <p class="text-xs text-[#626F86] mt-1">Format: 2026-03-02</p>

          <!-- Open Date Picker Popup: small white popup, month heading "March 2026" with prev/next buttons, 7-column grid starting Monday, day 13 selected, today marked with 1px primary outline -->
          <div class="date-picker-popup absolute left-0 top-[66px] z-50 p-4 w-[280px]">
            <!-- Month Header with navigation -->
            <div class="flex items-center justify-between mb-3">
              <button 
                type="button" 
                aria-label="Previous month" 
                class="w-7 h-7 flex items-center justify-center text-[#626F86] hover:text-[#1D2125] rounded-[4px] border border-[#8590A2] bg-white focus-ring"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
              </button>
              <span class="text-sm font-semibold text-[#1D2125]">March 2026</span>
              <button 
                type="button" 
                aria-label="Next month" 
                class="w-7 h-7 flex items-center justify-center text-[#626F86] hover:text-[#1D2125] rounded-[4px] border border-[#8590A2] bg-white focus-ring"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
              </button>
            </div>

            <!-- Day of Week Headers (7-column starting Monday: Mo, Tu, We, Th, Fr, Sa, Su) -->
            <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-[#626F86] mb-1.5">
              <span>Mo</span>
              <span>Tu</span>
              <span>We</span>
              <span>Th</span>
              <span>Fr</span>
              <span>Sa</span>
              <span>Su</span>
            </div>

            <!-- Calendar Days Grid (March 2026 starts on Sunday, March 1st. In a Mon-start grid: Mo-Sa of prev month are blank/23-28 Feb, Su is 1st. Or 23 Feb to 1 Mar).
                 Let's check March 2026:
                 March 1, 2026 is a Sunday!
                 Column 1: Mo (Feb 23)
                 Column 2: Tu (Feb 24)
                 Column 3: We (Feb 25)
                 Column 4: Th (Feb 26)
                 Column 5: Fr (Feb 27)
                 Column 6: Sa (Feb 28)
                 Column 7: Su (1)
                 Then Row 2: 2, 3, 4, 5, 6, 7, 8
                 Row 3: 9, 10, 11, 12, 13, 14, 15
                 Row 4: 16, 17, 18, 19, 20, 21, 22
                 Row 5: 23, 24, 25, 26, 27, 28, 29
                 Row 6: 30, 31, (1, 2, 3, 4, 5 Apr)
            -->
            <div class="grid grid-cols-7 gap-1 text-center text-xs">
              <!-- Row 1: previous month overflow (muted) and Sun 1 -->
              <span class="h-7 flex items-center justify-center text-[#626F86] opacity-40">23</span>
              <span class="h-7 flex items-center justify-center text-[#626F86] opacity-40">24</span>
              <span class="h-7 flex items-center justify-center text-[#626F86] opacity-40">25</span>
              <span class="h-7 flex items-center justify-center text-[#626F86] opacity-40">26</span>
              <span class="h-7 flex items-center justify-center text-[#626F86] opacity-40">27</span>
              <span class="h-7 flex items-center justify-center text-[#626F86] opacity-40">28</span>
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">1</button>

              <!-- Row 2: 2 - 8 (Note: March 2 is start date) -->
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">2</button>
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">3</button>
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">4</button>
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">5</button>
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">6</button>
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">7</button>
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">8</button>

              <!-- Row 3: 9 - 15 (Day 13 selected: primary fill, white text; today's date marked by a 1px primary outline - today in the synthetic prototype timeframe is around early/mid March or Day 10) -->
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">9</button>
              <!-- Today marked by 1px primary outline (#0C66E4) -->
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] border border-[#0C66E4] font-medium" title="Today">10</button>
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">11</button>
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">12</button>
              <!-- Day 13 selected: primary fill (#0C66E4), white text -->
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] bg-[#0C66E4] text-white font-semibold">13</button>
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">14</button>
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">15</button>

              <!-- Row 4: 16 - 22 -->
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">16</button>
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">17</button>
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">18</button>
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">19</button>
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">20</button>
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">21</button>
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">22</button>

              <!-- Row 5: 23 - 29 -->
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">23</button>
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">24</button>
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">25</button>
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">26</button>
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">27</button>
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">28</button>
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">29</button>

              <!-- Row 6: 30, 31, April overflow -->
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">30</button>
              <button type="button" class="h-7 w-7 mx-auto flex items-center justify-center rounded-[4px] text-[#1D2125] hover:bg-[#F1F2F4]">31</button>
              <span class="h-7 flex items-center justify-center text-[#626F86] opacity-40">1</span>
              <span class="h-7 flex items-center justify-center text-[#626F86] opacity-40">2</span>
              <span class="h-7 flex items-center justify-center text-[#626F86] opacity-40">3</span>
              <span class="h-7 flex items-center justify-center text-[#626F86] opacity-40">4</span>
              <span class="h-7 flex items-center justify-center text-[#626F86] opacity-40">5</span>
            </div>
          </div>
        </div>

        <!-- Days worked: numeric input "10" -->
        <!-- Added extra top margin to comfortably accommodate the open popup height if needed or let flow naturally -->
        <div class="pt-[220px]">
          <label for="days-worked" class="block text-base font-normal text-[#1D2125] mb-1.5">
            Days worked
          </label>
          <input 
            type="number" 
            id="days-worked" 
            name="days_worked" 
            value="10" 
            class="w-full h-9 px-3 text-base bg-white border border-[#8590A2] rounded-[6px] text-[#1D2125] focus-ring"
          />
        </div>

        <!-- Status: read-only text "Active" -->
        <div>
          <label class="block text-base font-normal text-[#1D2125] mb-1.5">
            Status
          </label>
          <div class="h-9 flex items-center text-base text-[#1D2125]">
            Active
          </div>
        </div>

        <!-- Description: multi-line text area with "Synthetic sample iteration."; below it a primary text link "Formatting help" -->
        <div>
          <label for="description" class="block text-base font-normal text-[#1D2125] mb-1.5">
            Description
          </label>
          <textarea 
            id="description" 
            name="description" 
            rows="5" 
            class="w-full p-3 text-base bg-white border border-[#8590A2] rounded-[6px] text-[#1D2125] focus-ring"
          >Synthetic sample iteration.</textarea>
          <div class="mt-1.5">
            <a href="#" class="text-sm text-[#0C66E4] hover:underline focus-ring rounded-[2px]">Formatting help</a>
          </div>
        </div>

        <!-- Buttons below the form, left aligned: primary "Save", then neutral "Reset", then neutral "Cancel" -->
        <div class="pt-2 flex items-center space-x-2">
          <button 
            type="submit" 
            class="h-9 px-4 text-base font-medium text-white bg-[#0C66E4] hover:bg-[#0055CC] rounded-[6px] transition-colors focus-ring"
          >
            Save
          </button>
          <button 
            type="reset" 
            title="Restores the form's initial values without saving" 
            class="h-9 px-4 text-base font-normal text-[#1D2125] bg-white border border-[#8590A2] hover:bg-[#F1F2F4] rounded-[6px] transition-colors focus-ring"
          >
            Reset
          </button>
          <button 
            type="button" 
            class="h-9 px-4 text-base font-normal text-[#1D2125] bg-white border border-[#8590A2] hover:bg-[#F1F2F4] rounded-[6px] transition-colors focus-ring"
          >
            Cancel
          </button>
        </div>

      </form>
    </div>
  </main>

</body>
</html>
