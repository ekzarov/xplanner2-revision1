<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects - Planner</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #F7F8FA;
      color: #1D2125;
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* Accessibility Skip Link */
    .skip-link {
      position: absolute;
      top: -9999px;
      left: 16px;
      z-index: 1000;
      background: #FFFFFF;
      color: #0C66E4;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: underline;
      border: 1px solid #8590A2;
      border-radius: 6px;
    }
    .skip-link:focus {
      top: 10px;
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
    }

    /* Interactive Focus Rings */
    a:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
    }

    /* Top Bar */
    header.top-bar {
      height: 56px;
      background-color: #FFFFFF;
      border-bottom: 1px solid #DCDFE4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      color: #1D2125;
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .search-form {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-label {
      font-size: 14px;
      color: #1D2125;
      white-space: nowrap;
    }

    .search-input {
      height: 36px;
      width: 240px;
      background-color: #FFFFFF;
      border: 1px solid #8590A2;
      border-radius: 6px;
      padding: 0 12px;
      font-family: inherit;
      font-size: 14px;
      color: #1D2125;
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .top-link {
      font-size: 14px;
      color: #0C66E4;
      text-decoration: none;
    }
    .top-link:hover {
      text-decoration: underline;
      color: #0055CC;
    }

    /* Main Container */
    main {
      padding: 32px 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .page-title {
      font-size: 24px;
      font-weight: 600;
      color: #1D2125;
      margin-bottom: 12px;
      line-height: 1.25;
    }

    .action-links {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      font-size: 14px;
    }

    .action-link {
      color: #0C66E4;
      text-decoration: none;
    }
    .action-link:hover {
      text-decoration: underline;
      color: #0055CC;
    }

    /* Table Component */
    .table-container {
      background-color: #FFFFFF;
      border: 1px solid #DCDFE4;
      border-radius: 6px;
      overflow: hidden;
    }

    table.data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    table.data-table th {
      background-color: #F1F2F4;
      color: #1D2125;
      font-weight: 600;
      border-bottom: 1px solid #DCDFE4;
      padding: 0 16px;
      height: 40px;
    }

    .sort-button {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #1D2125;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      margin-left: -6px;
      border-radius: 4px;
      text-align: left;
    }

    .sort-button:hover {
      background-color: rgba(9, 30, 66, 0.08);
    }

    table.data-table td {
      height: 40px;
      padding: 0 16px;
      border-bottom: 1px solid #DCDFE4;
      color: #1D2125;
      vertical-align: middle;
    }

    table.data-table tr:last-child td {
      border-bottom: none;
    }

    table.data-table td.col-id {
      width: 80px;
      font-variant-numeric: tabular-nums;
    }

    table.data-table td.col-name {
      width: 50%;
    }

    table.data-table td.col-iteration {
      width: auto;
    }

    .table-link {
      color: #0C66E4;
      text-decoration: none;
    }
    .table-link:hover {
      text-decoration: underline;
      color: #0055CC;
    }
  </style>
</head>
<body>
  <!-- Visually hidden Skip to main content link for keyboard accessibility -->
  <a href="#main" class="skip-link">Skip to main content</a>

  <header class="top-bar">
    <div class="top-bar-left">
      <span class="brand">Planner</span>
      <form class="search-form" role="search" onsubmit="return false;">
        <label for="search-input" class="search-label">Search or ID</label>
        <input type="search" id="search-input" name="q" class="search-input">
      </form>
    </div>
    <div class="top-bar-right">
      <a href="#me" class="top-link">Me</a>
      <a href="#signout" class="top-link">Sign out</a>
    </div>
  </header>

  <main id="main">
    <h1 class="page-title">Projects</h1>

    <div class="action-links">
      <a href="#people" class="action-link">People</a>
      <a href="#timesheet" class="action-link">Aggregate timesheet</a>
    </div>

    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th scope="col" aria-sort="ascending" class="col-id">
              <button type="button" class="sort-button">
                ID <span aria-hidden="true">&#9650;</span>
              </button>
            </th>
            <th scope="col" aria-sort="none" class="col-name">
              <button type="button" class="sort-button">
                Name
              </button>
            </th>
            <th scope="col" aria-sort="none" class="col-iteration">
              <button type="button" class="sort-button">
                Current iteration
              </button>
            </th>
            <th scope="col" aria-sort="none" class="col-hidden">
              <button type="button" class="sort-button">
                Hidden
              </button>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="col-id">1</td>
            <td class="col-name">
              <a href="#project-1" class="table-link">Project 1</a>
            </td>
            <td class="col-iteration">
              <a href="#iteration-3" class="table-link">Iteration 3</a>
            </td>
            <td class="col-hidden">No</td>
          </tr>
          <tr>
            <td class="col-id">2</td>
            <td class="col-name">
              <a href="#project-2" class="table-link">Project 2</a>
            </td>
            <td class="col-iteration">
              <a href="#iteration-6" class="table-link">Iteration 6</a>
            </td>
            <td class="col-hidden">No</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
