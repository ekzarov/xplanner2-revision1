<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects - Planner</title>
  <style>
    /* Reset & Foundation */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: #1D2125;
      background-color: #F7F8FA;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Accessibility: Skip link */
    .skip-link {
      position: absolute;
      top: -100px;
      left: 16px;
      background: #0C66E4;
      color: #FFFFFF;
      padding: 8px 16px;
      text-decoration: none;
      font-weight: 500;
      border-radius: 6px;
      z-index: 9999;
      transition: top 0.15s ease-in-out;
    }
    .skip-link:focus {
      top: 10px;
      outline: 2px solid #FFFFFF;
      outline-offset: 2px;
    }

    /* Focus ring standard */
    a:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
    }

    /* Top bar */
    header.top-bar {
      height: 56px;
      background-color: #FFFFFF;
      border-bottom: 1px solid #DCDFE4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 600;
      color: #1D2125;
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .search-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-label {
      font-size: 14px;
      color: #1D2125;
      white-space: nowrap;
    }

    .search-input {
      height: 36px;
      width: 220px;
      padding: 0 10px;
      font-family: inherit;
      font-size: 14px;
      color: #1D2125;
      background-color: #FFFFFF;
      border: 1px solid #8590A2;
      border-radius: 6px;
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .top-nav-link {
      font-size: 14px;
      color: #0C66E4;
      text-decoration: none;
    }
    .top-nav-link:hover {
      text-decoration: underline;
    }

    /* Main Container */
    main {
      max-width: 1216px;
      margin: 0 auto;
      padding: 32px 32px 64px 32px;
    }

    /* Page Header */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 600;
      color: #1D2125;
      line-height: 1.25;
    }

    .btn-primary {
      height: 36px;
      padding: 0 16px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: #FFFFFF;
      background-color: #0C66E4;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }
    .btn-primary:hover {
      background-color: #0055CC;
    }

    /* Sub-navigation links below header */
    .sub-nav {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .sub-nav-link {
      font-size: 14px;
      color: #0C66E4;
      text-decoration: none;
    }
    .sub-nav-link:hover {
      text-decoration: underline;
    }

    /* Table Component */
    .table-container {
      background-color: #FFFFFF;
      border: 1px solid #DCDFE4;
      border-radius: 6px;
      overflow: hidden;
    }

    table.projects-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      text-align: left;
    }

    thead th {
      background-color: #F1F2F4;
      font-weight: 600;
      color: #1D2125;
      height: 40px;
      padding: 0 16px;
      border-bottom: 1px solid #DCDFE4;
    }

    thead th.col-id {
      width: 80px;
    }

    thead th.col-name {
      width: 320px;
    }

    thead th.col-iteration {
      width: 280px;
    }

    thead th.col-hidden {
      width: 120px;
    }

    /* Sortable Header Button */
    .sort-btn {
      all: unset;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #1D2125;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .sort-btn:focus-visible {
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
      border-radius: 2px;
    }

    .sort-indicator {
      font-size: 11px;
      color: #1D2125;
      user-select: none;
    }

    /* Table body rows */
    tbody tr {
      height: 40px;
      border-bottom: 1px solid #DCDFE4;
      background-color: #FFFFFF;
    }
    tbody tr:last-child {
      border-bottom: none;
    }

    tbody td {
      padding: 0 16px;
      color: #1D2125;
    }

    tbody td a {
      color: #0C66E4;
      text-decoration: none;
    }
    tbody td a:hover {
      text-decoration: underline;
    }

    .empty-cell {
      color: #626F86;
    }
  </style>
</head>
<body>

  <!-- Accessibility Skip Link -->
  <a href="#main" class="skip-link">Skip to main content</a>

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="top-bar-left">
      <a href="#" class="brand-name">Planner</a>
      <div class="search-group">
        <label for="search-input" class="search-label">Search or ID</label>
        <input type="text" id="search-input" class="search-input">
      </div>
    </div>
    <nav class="top-bar-right" aria-label="User navigation">
      <a href="#" class="top-nav-link">System information</a>
      <a href="#" class="top-nav-link">Me</a>
      <a href="#" class="top-nav-link">Sign out</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main id="main">
    <div class="page-header">
      <h1 class="page-title">Projects</h1>
      <button type="button" class="btn-primary">Create project</button>
    </div>

    <div class="sub-nav">
      <a href="#" class="sub-nav-link">People</a>
      <a href="#" class="sub-nav-link">Aggregate timesheet</a>
    </div>

    <!-- Projects Table -->
    <div class="table-container">
      <table class="projects-table">
        <thead>
          <tr>
            <th scope="col" class="col-id" aria-sort="ascending">
              <button type="button" class="sort-btn">
                ID <span class="sort-indicator" aria-hidden="true">▲</span>
              </button>
            </th>
            <th scope="col" class="col-name" aria-sort="none">
              <button type="button" class="sort-btn">
                Name
              </button>
            </th>
            <th scope="col" class="col-iteration" aria-sort="none">
              <button type="button" class="sort-btn">
                Current iteration
              </button>
            </th>
            <th scope="col" class="col-hidden" aria-sort="none">
              <button type="button" class="sort-btn">
                Hidden
              </button>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td><a href="#">Project 1</a></td>
            <td><a href="#">Iteration 3</a></td>
            <td>No</td>
          </tr>
          <tr>
            <td>2</td>
            <td><a href="#">Project 2</a></td>
            <td><a href="#">Iteration 6</a></td>
            <td>No</td>
          </tr>
          <tr>
            <td>3</td>
            <td><a href="#">Project 3</a></td>
            <td class="empty-cell"></td>
            <td>Yes</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

</body>
</html>
