<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>System information - Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0C66E4",
            "primary-hover": "#0055CC",
            "page-bg": "#F7F8FA",
            "surface": "#FFFFFF",
            "table-header": "#F1F2F4",
            "text-main": "#1D2125",
            "secondary-text": "#626F86",
            "control-border": "#8590A2",
            "divider": "#DCDFE4",
            "row-selected": "#E9F2FF",
            "completion": "#1F7A45",
            "danger": "#C9372C"
          },
          fontFamily: {
            sans: [
              "system-ui",
              "-apple-system",
              "Segoe UI",
              "Roboto",
              "Helvetica Neue",
              "Arial",
              "sans-serif"
            ]
          },
          borderRadius: {
            DEFAULT: "6px",
            sm: "6px",
            md: "6px",
            lg: "6px"
          }
        }
      }
    }
  </script>
<style>
    /* Material Lean strictly enforced font & focus system */
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #F7F8FA;
      color: #1D2125;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    
    /* Strict focus outline rule: 2px #0C66E4 with 2px offset */
    a:focus-visible, 
    button:focus-visible, 
    input:focus-visible {
      outline: 2px solid #0C66E4 !important;
      outline-offset: 2px !important;
    }
    
    .tabular-numbers {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="bg-page-bg text-text-main min-h-screen flex flex-col">
<!-- Top Bar -->
<header class="w-full bg-surface h-14 px-6 flex items-center justify-between border-b border-divider">
<div class="flex items-center space-x-6">
<!-- Planner brand text -->
<span class="text-base font-semibold text-text-main tracking-tight">Planner</span>
<!-- Search input field with visible label 'Search or ID' -->
<form class="flex items-center space-x-2" onsubmit="event.preventDefault();">
<label class="text-sm font-normal text-text-main whitespace-nowrap cursor-pointer" for="search-input">Search or ID</label>
<input class="h-9 px-3 bg-surface text-text-main text-sm border border-control-border rounded-[6px] focus:outline-none focus:ring-0 focus:border-primary w-56 transition-colors duration-150" id="search-input" type="search"/>
</form>
</div>
<!-- Right-side actions -->
<nav aria-label="User navigation" class="flex items-center space-x-4">
<a class="text-sm font-normal text-primary hover:text-primary-hover transition-colors duration-150 rounded-[6px]" href="#me">Me</a>
<a class="text-sm font-normal text-primary hover:text-primary-hover transition-colors duration-150 rounded-[6px]" href="#signout">Sign out</a>
</nav>
</header>
<!-- Breadcrumb -->
<nav aria-label="Breadcrumb" class="w-full px-6 py-4">
<div class="max-w-7xl mx-auto flex items-center text-sm">
<a class="text-primary hover:text-primary-hover transition-colors duration-150 rounded-[6px]" href="#top">Top</a>
<span aria-hidden="true" class="mx-2 text-secondary-text">/</span>
<span aria-current="page" class="text-text-main font-normal">System information</span>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="w-full px-6 pb-12 flex-1">
<div class="max-w-7xl mx-auto">
<!-- Page Heading -->
<h1 class="text-2xl font-semibold text-text-main mb-5 tracking-tight leading-snug">System information</h1>
<!-- System Information Table Container -->
<section aria-labelledby="system-info-title" class="bg-surface border border-divider rounded-[6px] overflow-hidden">
<h2 class="sr-only" id="system-info-title">System details</h2>
<table class="w-full border-collapse text-left">
<thead>
<tr class="bg-table-header border-b border-divider h-10">
<th class="px-4 text-sm font-semibold text-text-main w-1/3" scope="col">Item</th>
<th class="px-4 text-sm font-semibold text-text-main w-2/3" scope="col">Value</th>
</tr>
</thead>
<tbody class="divide-y divide-divider text-sm text-text-main">
<!-- Row: Version -->
<tr class="h-10 hover:bg-page-bg transition-colors duration-150">
<td class="px-4 font-normal text-text-main">Version</td>
<td class="px-4 font-normal text-text-main tabular-numbers">1.0.0 (synthetic)</td>
</tr>
<!-- Row: Build date -->
<tr class="h-10 hover:bg-page-bg transition-colors duration-150">
<td class="px-4 font-normal text-text-main">Build date</td>
<td class="px-4 font-normal text-text-main tabular-numbers">2026-03-01</td>
</tr>
<!-- Row: Build revision -->
<tr class="h-10 hover:bg-page-bg transition-colors duration-150">
<td class="px-4 font-normal text-text-main">Build revision</td>
<td class="px-4 font-normal text-text-main tabular-numbers font-mono text-[13px]">0000000</td>
</tr>
<!-- Row: Application server -->
<tr class="h-10 hover:bg-page-bg transition-colors duration-150">
<td class="px-4 font-normal text-text-main">Application server</td>
<td class="px-4 font-normal text-text-main">Synthetic server 1.0</td>
</tr>
<!-- Row: Java runtime -->
<tr class="h-10 hover:bg-page-bg transition-colors duration-150">
<td class="px-4 font-normal text-text-main">Java runtime</td>
<td class="px-4 font-normal text-text-main">Synthetic runtime 1.0</td>
</tr>
<!-- Row: Memory used -->
<tr class="h-10 hover:bg-page-bg transition-colors duration-150">
<td class="px-4 font-normal text-text-main">Memory used</td>
<td class="px-4 font-normal text-text-main tabular-numbers">256 MB of 1024 MB</td>
</tr>
</tbody>
</table>
</section>
</div>
</main>
</body></html>
