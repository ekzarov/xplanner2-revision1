<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UX13-25 Error - Planner</title>
  <style>
    /* Reset & Foundation Tokens */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #F7F8FA;
      color: #1D2125;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Skip link */
    .skip-link {
      position: absolute;
      top: -9999px;
      left: 16px;
      background: #FFFFFF;
      color: #0C66E4;
      padding: 8px 16px;
      font-weight: 600;
      border: 2px solid #0C66E4;
      border-radius: 6px;
      z-index: 10000;
      text-decoration: none;
      outline: none;
    }
    .skip-link:focus {
      top: 10px;
    }

    /* Focus styles */
    a:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
    }

    /* Top Bar */
    header.top-bar {
      height: 56px;
      background-color: #FFFFFF;
      border-bottom: 1px solid #DCDFE4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 700;
      color: #1D2125;
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .search-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-group label {
      font-size: 14px;
      color: #1D2125;
      white-space: nowrap;
    }

    .search-input {
      width: 240px;
      height: 32px;
      padding: 0 10px;
      border: 1px solid #8590A2;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      color: #1D2125;
      background-color: #FFFFFF;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-link {
      color: #0C66E4;
      text-decoration: none;
      font-size: 14px;
    }
    .nav-link:hover {
      text-decoration: underline;
    }

    /* Main Container */
    main {
      padding: 32px 24px;
    }

    /* Error Card */
    .error-card {
      width: 100%;
      max-width: 640px;
      background-color: #FFFFFF;
      border: 1px solid #DCDFE4;
      border-radius: 6px;
      padding: 32px;
    }

    .error-title {
      font-size: 24px;
      font-weight: 600;
      color: #1D2125;
      margin-bottom: 16px;
      line-height: 1.25;
    }

    .error-description {
      font-size: 14px;
      color: #1D2125;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .error-reference {
      font-size: 14px;
      color: #1D2125;
      margin-bottom: 32px;
    }

    .error-action-link {
      display: inline-block;
      color: #0C66E4;
      text-decoration: none;
      font-size: 14px;
      border-radius: 4px;
    }
    .error-action-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- Skip Link for Accessibility -->
  <a href="#main" class="skip-link">Skip to main content</a>

  <!-- Top bar -->
  <header class="top-bar">
    <div class="nav-left">
      <a href="#" class="brand-name">Planner</a>
      <div class="search-group">
        <label for="site-search">Search or ID</label>
        <input type="search" id="site-search" name="q" class="search-input" autocomplete="off">
      </div>
    </div>
    <div class="nav-right">
      <a href="#" class="nav-link">Me</a>
      <a href="#" class="nav-link">Sign out</a>
    </div>
  </header>

  <!-- Main content area -->
  <main id="main">
    <section class="error-card" aria-labelledby="error-heading">
      <h1 id="error-heading" class="error-title">An error has occurred.</h1>
      <p class="error-description">The request could not be completed. Please quote this reference when you report the problem.</p>
      <p class="error-reference">Reference: 7F3A-21C9</p>
      <div>
        <a href="#" class="error-action-link">Go to projects</a>
      </div>
    </section>
  </main>
</body>
</html>
