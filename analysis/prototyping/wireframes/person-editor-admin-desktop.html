<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit person: User C</title>
  <style>
    /* Foundation resets & system font stack */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: #1D2125;
      background-color: #F7F8FA;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Accessibility: Skip link */
    .skip-link {
      position: absolute;
      top: -9999px;
      left: 16px;
      background: #0C66E4;
      color: #FFFFFF;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      text-decoration: none;
      z-index: 1000;
    }
    .skip-link:focus {
      top: 8px;
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
    }

    /* Focus ring standard */
    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid #0C66E4;
      outline-offset: 2px;
    }

    /* Top navigation bar */
    .top-bar {
      background-color: #FFFFFF;
      height: 56px;
      border-bottom: 1px solid #DCDFE4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 700;
      color: #1D2125;
      letter-spacing: -0.01em;
      text-decoration: none;
    }

    .search-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-label {
      font-size: 14px;
      color: #1D2125;
      font-weight: 500;
    }

    .search-input {
      width: 220px;
      height: 36px;
      background: #FFFFFF;
      border: 1px solid #8590A2;
      border-radius: 6px;
      padding: 0 12px;
      font-family: inherit;
      font-size: 14px;
      color: #1D2125;
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-link {
      color: #0C66E4;
      font-size: 14px;
      text-decoration: none;
      font-weight: 500;
    }
    .nav-link:hover {
      text-decoration: underline;
    }

    /* Main Container */
    main {
      flex: 1;
      padding: 24px;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
    }

    /* Breadcrumb */
    .breadcrumb-nav {
      margin-bottom: 16px;
    }

    .breadcrumb-list {
      display: flex;
      align-items: center;
      list-style: none;
      font-size: 14px;
      color: #626F86;
    }

    .breadcrumb-item {
      display: flex;
      align-items: center;
    }

    .breadcrumb-item + .breadcrumb-item::before {
      content: "/";
      margin: 0 8px;
      color: #626F86;
    }

    .breadcrumb-link {
      color: #0C66E4;
      text-decoration: none;
    }
    .breadcrumb-link:hover {
      text-decoration: underline;
    }

    .breadcrumb-current {
      color: #1D2125;
      font-weight: 500;
    }

    /* Page Heading */
    .page-heading {
      font-size: 24px;
      font-weight: 600;
      color: #1D2125;
      margin-bottom: 24px;
    }

    /* Form Card Container */
    .form-card {
      background-color: #FFFFFF;
      border: 1px solid #DCDFE4;
      border-radius: 6px;
      max-width: 640px;
      padding: 24px;
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }

    .form-label {
      font-size: 16px;
      font-weight: 500;
      color: #1D2125;
      margin-bottom: 8px;
    }

    .text-input,
    .select-input {
      width: 100%;
      height: 36px;
      background-color: #FFFFFF;
      border: 1px solid #8590A2;
      border-radius: 6px;
      padding: 0 12px;
      font-family: inherit;
      font-size: 16px;
      color: #1D2125;
    }

    .checkbox-group {
      margin-top: 4px;
      margin-bottom: 24px;
    }

    .checkbox-label-container {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
    }

    .native-checkbox {
      margin-top: 4px;
      width: 16px;
      height: 16px;
      accent-color: #0C66E4;
      cursor: pointer;
    }

    .checkbox-text-wrapper {
      display: flex;
      flex-direction: column;
    }

    .checkbox-title {
      font-size: 16px;
      font-weight: 500;
      color: #1D2125;
    }

    .checkbox-hint {
      font-size: 14px;
      color: #626F86;
      margin-top: 2px;
    }

    /* Project Roles Section */
    .section-heading {
      font-size: 20px;
      font-weight: 600;
      color: #1D2125;
      margin-bottom: 12px;
      margin-top: 8px;
    }

    .roles-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      margin-bottom: 24px;
      border: 1px solid #DCDFE4;
      border-radius: 6px;
      overflow: hidden;
    }

    .roles-table th {
      background-color: #F1F2F4;
      text-align: left;
      padding: 8px 12px;
      font-weight: 600;
      color: #1D2125;
      border-bottom: 1px solid #DCDFE4;
      height: 40px;
    }

    .roles-table td {
      padding: 8px 12px;
      border-bottom: 1px solid #DCDFE4;
      height: 40px;
      vertical-align: middle;
      color: #1D2125;
    }

    .roles-table tr:last-child td {
      border-bottom: none;
    }

    .role-select {
      height: 32px;
      border: 1px solid #8590A2;
      border-radius: 6px;
      background-color: #FFFFFF;
      font-family: inherit;
      font-size: 14px;
      padding: 0 8px;
      color: #1D2125;
      width: 130px;
    }

    .static-role {
      font-size: 14px;
      color: #1D2125;
    }

    /* Actions below form */
    .form-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      height: 36px;
      padding: 0 16px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      text-decoration: none;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .btn-primary {
      background-color: #0C66E4;
      color: #FFFFFF;
      border-color: #0C66E4;
    }
    .btn-primary:hover {
      background-color: #0055CC;
      border-color: #0055CC;
    }

    .btn-neutral {
      background-color: #FFFFFF;
      color: #1D2125;
      border-color: #8590A2;
    }
    .btn-neutral:hover {
      background-color: #F1F2F4;
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <a href="#main" class="skip-link">Skip to main content</a>
    <div class="top-bar-left">
      <a href="#" class="brand-name">Planner</a>
      <div class="search-wrapper">
        <label for="search-field" class="search-label">Search or ID</label>
        <input type="text" id="search-field" class="search-input" />
      </div>
    </div>
    <div class="top-bar-right">
      <a href="#" class="nav-link">Me</a>
      <a href="#" class="nav-link">Sign out</a>
    </div>
  </header>

  <main id="main">
    <nav class="breadcrumb-nav" aria-label="Breadcrumb">
      <ol class="breadcrumb-list">
        <li class="breadcrumb-item"><a href="#" class="breadcrumb-link">Top</a></li>
        <li class="breadcrumb-item"><a href="#" class="breadcrumb-link">People</a></li>
        <li class="breadcrumb-item"><a href="#" class="breadcrumb-link">User C</a></li>
        <li class="breadcrumb-item"><span class="breadcrumb-current" aria-current="page">Edit</span></li>
      </ol>
    </nav>

    <h1 class="page-heading">Edit person: User C</h1>

    <div class="form-card">
      <form action="#" method="post" novalidate>
        <div class="form-group">
          <label for="name" class="form-label">Name (required)</label>
          <input type="text" id="name" name="name" class="text-input" value="User C" required>
        </div>

        <div class="form-group">
          <label for="user-id" class="form-label">User ID (required)</label>
          <input type="text" id="user-id" name="user_id" class="text-input" value="userc" required>
        </div>

        <div class="form-group">
          <label for="initials" class="form-label">Initials (required)</label>
          <input type="text" id="initials" name="initials" class="text-input" value="UC" required>
        </div>

        <div class="form-group">
          <label for="email" class="form-label">E-mail (required)</label>
          <input type="email" id="email" name="email" class="text-input" value="userc@example.test" required>
        </div>

        <div class="form-group">
          <label for="phone" class="form-label">Phone</label>
          <input type="tel" id="phone" name="phone" class="text-input" value="000-0003">
        </div>

        <div class="form-group">
          <label for="new-password" class="form-label">New password</label>
          <input type="password" id="new-password" name="new_password" class="text-input">
        </div>

        <div class="form-group">
          <label for="confirm-password" class="form-label">Confirm password</label>
          <input type="password" id="confirm-password" name="confirm_password" class="text-input">
        </div>

        <div class="checkbox-group">
          <label class="checkbox-label-container" for="deactivated">
            <input type="checkbox" id="deactivated" name="deactivated" class="native-checkbox">
            <div class="checkbox-text-wrapper">
              <span class="checkbox-title">Deactivated</span>
              <span class="checkbox-hint">A deactivated person cannot sign in or take new assignments; time and history are kept.</span>
            </div>
          </label>
        </div>

        <h2 class="section-heading">Project roles</h2>
        <table class="roles-table">
          <thead>
            <tr>
              <th scope="col">Project</th>
              <th scope="col">Role</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Project 1</td>
              <td>
                <label for="role-project-1" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;">Role for Project 1</label>
                <select id="role-project-1" name="role_project_1" class="role-select">
                  <option value="None">None</option>
                  <option value="Viewer">Viewer</option>
                  <option value="Editor" selected>Editor</option>
                  <option value="Admin">Admin</option>
                </select>
              </td>
            </tr>
            <tr>
              <td>Project 2</td>
              <td><span class="static-role">Viewer</span></td>
            </tr>
            <tr>
              <td>Project 3</td>
              <td><span class="static-role">None</span></td>
            </tr>
          </tbody>
        </table>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="reset" class="btn btn-neutral">Reset</button>
          <button type="button" class="btn btn-neutral">Cancel</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
