# ARTIFACT RESPONSIBILITY START (guidance, not project state)
# Created by: The Bootstrap initializer creates the checkpoint from its template.
# Maintained / decided by: PM records durable outcomes, blockers and authorized transitions from specialist evidence; reviewers never edit shared status.
# Governing instructions: Bootstrap and Stage 1-19 status contract; analysis/agent-roles.md
# ARTIFACT RESPONSIBILITY END
# yaml-language-server: $schema=./migration_status.schema.json
# =============================================================================
# ARTIFACT GUIDANCE (not project data)
# =============================================================================
# Template output: analysis/migration_status.yaml. Preserve this filename stem.
# See analysis/artifact-naming.md for the naming contract.
# Single process checkpoint, created once during Bootstrap. It is a standing
# input and updated output of every Stage 1-19; stages never create copies.
# When used: the active-stage agent reads it before work to learn the current
# stage, blockers and exact next action.
# How used: the same agent updates it before handoff after a durable transition,
# return, gate result, blocker or owner decision. Do not rewrite it for polling
# or every internal action; a passing command never advances the stage by itself.
# Example: after a clean Stage 7 report, the Stage 7 agent adds the report to
# review_passes and records the transition to Stage 8. The Stage 8 agent reads
# that same checkpoint before starting. Earlier reports become stale after a
# return and re-entry.
# =============================================================================
# PROJECT RECORD (machine-readable values start below)
# =============================================================================
schema_version: '1.5.0'
project:
  id: '{{PROJECT_ID}}'
  name: '{{PROJECT_NAME}}'
  owner: '{{PROJECT_OWNER}}'

control:
  state: bootstrap
  current_stage: bootstrap
  stage_status: awaiting_owner
  previous_stage: null
  next_action: 'Owner reviews and explicitly ratifies the project constitution.'
  automatic_advancement: false

constitution:
  status: unratified
  version: '0.2.2-draft'
  ratified_by: null
  ratified_at: null
  ratification_record: null

bootstrap_gates:
  initializer_self_test: pending
  status_schema_validation: pending
  command_contract_configured: pending
  owner_stage_1_approval: pending

transition_request: null
transition_history: []
review_passes: []
owner_decisions: []
blockers: []

legacy_walkthrough:
  outcome: pending
  scope: '{{PROJECT_ID}}'
  record: null
  decision_id: null
  unresolved_blocked_scopes: []

delivery:
  active_slice: null
  delivered_ui_slices: []
  ui_parity_corrections: []
  slice_status: not_started
  completed_slices: []
  completed_slice_evidence: []
  reopened_slices: []
  consolidated_backlog: null
  owner_walkthrough_reports: []
  owner_walkthrough_decision_id: null

progress:
  summary: 'Bootstrap files created; governance and commands are not yet ratified.'
  completed_percent: 0
  updated_at: '{{INITIALIZED_AT}}'
  agent_reviews:
    total: 0
    valid: 0
    blocked: 0
    invalid: 0
    active: 0

# Exact current architecture review records; initialize on adoption, never infer from filename order.
architecture_review:
  adopted_at: null
  records: []
  owner_verdict: null
  closure_report: null
